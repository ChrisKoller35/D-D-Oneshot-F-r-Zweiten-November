ine (Hellfire Engine) | 1 | 16 | 18 | 216 | MotM |\n| Rechts | Feuerriese | 1 | 9 | 18 | 162 | MM |\n\n---\n\n## Kapitel 6 – Sturm auf Veldgard\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| **Kazzamir, der Gehörnte** (Gehörnter Teufel) | 1 | 11 | 18 | 250 (verschärft; Standard 199) | MM |\n| Höllenhund | 2 | 3 | 15 | 58 | MM |\n\n---\n\n## Werte der Hordenkreaturen (Kurzfassung)\n\nFür alle Stellen, an denen die Horde einzeln ausgespielt wird (Kapitel 2,\n3, 6). Alle: Dunkelsicht 18 m. Das Statblock-Bild gilt, die Tabelle ist\ndie Tischfassung.\n\n| Kreatur | HG | RK | TP | Angriff | Besonderes |\n|---|---|---|---|---|---|\n| Goblin | 1/4 | 15 | 7 | Krummsäbel oder Kurzbogen +4, 1W6+2 | Flinke Flucht (Bonusaktion Rückzug/Verstecken) |\n| Goblin-Boss | 1 | 17 | 21 | 2× Krummsäbel +4, 1W6+2 | Umlenken (Reaktion: tauscht den Platz mit einem Verbündeten in 1,5 m) |\n| Hobgoblin-Krieger | 1/2 | 18 | 11 | Langschwert oder Langbogen +3, 1W8+1 | Kriegsglück: +2W6, wenn ein Verbündeter neben dem Ziel steht |\n| Hobgoblin-Hauptmann | 3 | 17 | 39 | 2× Großschwert +4, 2W6+2 / Wurfspeer +4, 1W6+2 | Kriegsglück; Führung: Verbündete in 9 m +1W4 auf Angriffe und Rettungswürfe |\n| Worg | 1/2 | 13 | 26 | Biss +5, 2W6+3, STR DC 13 oder liegend | Vorteil auf Wahrnehmung (Gehör, Geruch) |\n| Bugbear-Krieger | 1 | 14 | 33 | Packen +4, 2W6+2 (gepackt, Entkommen DC 12) / Leichter Hammer +4, 3W4+2 | Entführen: zieht Gepackte mit; Heimlichkeit +6 |\n| Bugbear-Pirscher | 3 | 15 | 65 | 2× Morgenstern +5, 2W8+3 (3 m) oder 2× Wurfspeer +5, 3W6+3 | Schneller Griff (Bonusaktion, GES DC 13 oder gepackt); Vorteil gegen Gepackte |\n| Oger-Kettenschläger (MotM) | 3 | 11 | 59 | Faust +6, 2W8+4; Kettenschlag (Aufladung 6) +6, 3 m, 2W8+4 und KON DC 14 oder betäubt | Kettenfeger: alle in 3 m GES DC 14 oder 2W8+4 |\n| Oger-Bolzenschleuder (MotM) | 2 | 13 | 59 | Faust +6, 2W8+4; Bolzenschleuder +6, 36/144 m, 3W10+4 | schießt vom Plattformrand |\n| Bogenschütze (MotM) | 3 | 16 | 75 | 2× Langbogen +6, 1W8+4 | Schützenauge (Bonusaktion): +1W10 auf den nächsten Treffer |\n| Hobgoblin-Eisenschatten (MotM) | 2 | 15 | 32 | 4× Schlag +4, 1W8+2 | Schattensprung (Bonusaktion, 9 m teleportieren); Selbstverkleidung, Kleine Illusion, Dunkelheit 1× |\n| Hobgoblin-Verwüster (MotM) | 4 | 13 | 45 | 2× Verheerender Blitz +5, 18 m, 4W8+3 Energie, Ziel liegt | Heeresmagie (Verbündete ausgenommen); je 2×/Tag Feuerball, Fliegen, Nebelwolke, Windstoß, Blitzstrahl (DC 13) |\n| Champion (MotM) | 9 | 18 | 143 | 3× Großschwert +9, 2W6+5, plus 2W6 solange über 72 TP / 3× Kurzbogen +6 | Unbeugsam (2×/Tag Rettungswurf wiederholen); Zweite Luft (Bonusaktion, 20 TP, 1×) |\n| Berserker | 2 | 13 | 67 | Großaxt +5, 1W12+3 | Rücksichtslos: Vorteil auf Angriffe, Angriffe gegen ihn mit Vorteil |\n| Höllenhund | 3 | 15 | 58 | Biss +5, 1W8+3 plus 1W6 Feuer; Feueratem (Aufladung 5–6) GES DC 12, 5W6 | Immun Feuer; Rudeltaktik |\n\n**Moral:** Goblins fliehen, wenn ihr Anführer fällt. Hobgoblins kämpfen\nbis zur Hälfte ihrer Zahl; der Champion flieht nie. Orks fliehen nie.\nWorgs fliehen, wenn ihr Reiter fällt. In 18 m um das Kettenbanner\n(Kapitel 4) haben alle Vorteil auf Rettungswürfe gegen Furcht.\n\n**Kettennarben:** Jeder Hobgoblin-Hauptmann, der Champion und der\nVerwüster tragen eine Kettennarbe – sie gehören Kazzamir. Goblins und\nOrks folgen nur ihren Häuptlingen; deshalb bricht die Horde, sobald die\ngroßen Ziele fallen.\n"}, "orte-burg-rabenwacht": {"title": "Burg Rabenwacht", "path": "Orte/Burg-Rabenwacht.md", "md": "# Burg Rabenwacht\n\nGrenzburg im offenen Land vor den Bergen, ein Stück vor dem Eingang des Felsenpasses; eine Straße führt von der Burg zum Pass. Schauplatz von Kapitel 1\n(Siegesfeier, Kriegsrat) und Kapitel 7 (Abschiedsfeier).\n\n<img class=\"map\" src=\"Karten/12-Burg-Rabenwacht-Aussen.png\" alt=\"Burg Rabenwacht\">\n\n*Burg Rabenwacht*\n\n<img class=\"map\" src=\"Karten/13-Burg-Rabenwacht-Ebene-1.png\" alt=\"Ebene 1\">\n\n*Ebene 1*\n\n<img class=\"map\" src=\"Karten/14-Burg-Rabenwacht-Ebene-2.png\" alt=\"Ebene 2\">\n\n*Ebene 2*\n\n## Überblick\n\nEine alte, quadratische Burg Nordgars auf einem Felssporn:\nBergfried, Ringmauer, ein Hof mit Brunnen, Schmiede und Ställen.\nGestern noch von der Horde besetzt, heute wieder in eigener Hand –\ndie Spuren sieht man überall: angekokelte Balken, Goblin-Graffiti\nin der Kapelle, ein Hordenbanner, das jemand als Fußabtreter vor das\nTor gelegt hat.\n"}, "orte-burg-veldgard": {"title": "Burg Veldgard", "path": "Orte/Burg-Veldgard.md", "md": "# Burg Veldgard\n\nDie Burg des Feindes. Schauplatz von Kapitel 6 (Endkampf).\n\n<img class=\"map\" src=\"Karten/05-Burg-Veldgard.png\" alt=\"Burg Veldgard\">\n\n*Burg Veldgard*\n\n## Überblick\n\nEhemalige Grenzburg Nordgars am Ostende des Passes, wo die Berge\naufhören und das Land wieder grün wird: Wiesen, Weiden, ein breiter\nFluss: das grüne Land Veldaren. Im Frühjahr von der Horde genommen\nund seitdem der Sitz ihres Anführers. Heller Stein, drei Türme, eine\nRingmauer, der Fluss als Graben auf zwei Seiten. Die Horde hat sie nicht gepflegt:\nHordenbanner statt Fahnen, Trophäen aus den Dörfern an den Zinnen,\nder Burggraben voller Abfall.\n\nVor der Burg: eine zweite, kleinere **Ebene** – hier stellt sich das\nHeer Nordgars zur letzten Schlacht und lockt die Reste der Horde\naus dem Tor.\n\n## Der Weg der Helden (kurz und gradlinig)\n\n1. **Über die Mauer** (Greifen): Beschuss von den Zinnen – 8 Goblins\n   mit Kurzbögen, die nicht weiter ausgespielt werden (GES DC 12 oder\n   2W8 Stich pro Held). Landung im **Burghof**.\n2. **Der Burghof:** 6 Hobgoblins (→ [Kampfübersicht](#feinde-uebersicht)), kurzer\n   Kampf.\n3. **Das Torhaus:** Offen. Dahinter ein Gang, 20 m, Fackeln. Vor der\n   Hallentür die drei Standarten der großen Ziele – zerrissen. Kein\n   Kampf – ein Anmarsch.\n4. **Die große Halle.**\n\n## Die große Halle\n\nDer ehemalige Rittersaal: 30 × 20 m, 12 m hoch, Holzdach. Am\nOstende, zwischen den Säulen, **Kazzamir, der Gehörnte**\n(→ [Kampfübersicht](#feinde-uebersicht)).\n\n**Zeichne auf die Karte:**\n- Zwei **Säulenreihen** längs der Halle, je vier Säulen\n  (Dreiviertel-Deckung).\n- **Umgestürzte Tische** in der Mitte (halbe Deckung).\n- Die **Tür**: Westseite. Sie bleibt zu – von draußen kommt niemand.\n- Der **Durchgang** zu den Gemächern: Ostseite, hinter dem Anführer.\n  Sein Fluchtweg, falls er einen braucht.\n- Zwei **Feuerschalen**: Wer hineingestoßen wird, nimmt 2W6 Feuer\n  (Kazzamir nicht – er ist immun gegen Feuer).\n\n**Keine Leibwache:** Kazzamir steht allein in der Halle. Seine\nHauptleute sind mit den großen Zielen gefallen oder kämpfen vor dem\nTor (→ Kapitel 6).\n\n## Keine Hilfe\n\nHedda, das Heer und (falls dabei) Argentys kämpfen vor dem Tor gegen\nden Rest der Horde. Niemand betritt die Halle, bevor der Anführer\ngefallen ist. Lass die Schlacht draußen hörbar sein – mehr nicht.\n\n## Nachts (nur bei Kapitel 5, Szenario C)\n\nNachts ist Veldgard voll besetzt: 20 Goblins und 8 Hobgoblins auf\nden Mauern, das Tor geschlossen, 2 Hobgoblin-Hauptleute in der Halle. Kein\nGreifenflug. Der Weg über die Mauer ist Kletterei (Athletik DC 15)\nunter Beschuss (jede Runde 2W6 Stich). Das ist der harte Weg – Milo\nwarnt davor.\n\n## Nach dem Sieg\n\nDie Hordenbanner werden von den Mauern gerissen. Orvin sammelt die\neisernen Bannerspitzen ein – für die Orden (→ [Übersicht](#belohnungen-uebersicht)).\n"}, "orte-der-fluchtgang": {"title": "Der Fluchtgang", "path": "Orte/Der-Fluchtgang.md", "md": "# Der Fluchtgang\n\nSchauplatz von Kapitel 1b (optional).\n\nEin alter Geheimgang der Burg Rabenwacht, vor Generationen als\nFluchtweg gehauen, von Nordgar vergessen, von der Horde im\nFrühjahr gefunden – in Rabenwacht weiß niemand davon. Er beginnt im\n**Keller** und endet 600 Meter weiter hinter einem **Dornbusch in\neiner Senke zwischen den Hügeln** vor der Ebene.\n\n<img class=\"map\" src=\"Karten/19-Battlemap-Kellergang.png\" alt=\"Battlemap – Kellergang, erster Kampf\">\n\n*Battlemap – Kellergang, erster Kampf*\n"}, "orte-drachenhort": {"title": "Drachenhort", "path": "Orte/Drachenhort.md", "md": "# Der Drachenhort\n\nSchauplatz von Kapitel 1c (optional): der Dungeon unter der\nSilberkanzel, in dem Argentys ihr Schwert **Silberzahn** versteckt hat.\nDrei Teile: **Ebene 1**, **Ebene 2** und der **Bossraum**.\n\n→ Kampfkarten (Draufsicht mit Raster): `Karten/06-Echohallen-Ebene-1.png` bis `Karten/11-Echohallen-Spiegelkammer.png`, Legende in [Karten](#karten-karten).\n\n<img class=\"map\" src=\"Karten/15-Drachenhort-Ebene-1.png\" alt=\"Ebene 1\">\n\n*Ebene 1*\n\n<img class=\"map\" src=\"Karten/16-Drachenhort-Ebene-2.png\" alt=\"Ebene 2\">\n\n*Ebene 2*\n\n<img class=\"map\" src=\"Karten/17-Drachenhort-Schatzkammer.png\" alt=\"Bossraum – Schatzkammer\">\n\n*Bossraum – Schatzkammer*\n\n## Überblick\n\nUnter dem Felsvorsprung „Silberkanzel\" am Rand der Wolkenwand\n(→ [Sturmgebiet](#orte-sturmgebiet)) liegt ein Höhlensystem, das der Wind\nausgehöhlt hat: Kammern, verbunden durch Spalten und einen Schacht, in\ndenen jedes Wort dreimal zurückkommt. Argentys hat hier vor Jahren\nSilberzahn eingeschlossen. Seit sie gefesselt im Talkessel liegt, hat\nniemand mehr die Hallen bewacht, und die Bestien des Sturmgebiets\nhaben sie besetzt: oben die Flieger und das Rudel, unten die Trolle,\nund ganz unten, in der Schatzkammer, das Tier, das alle anderen\nverdrängt hat. **Keine Horde, keine Teufel** – nur Wildnis\n(Christophs Entscheidung, 25.10.2026).\n\n## Wer wo wartet\n\n| Teil | Raum | Gegner | EP | Vier Kämpfer Stufe 8 |\n|---|---|---|---|---|\n| Ebene 1 | Windkammer | 2 Mantikore (je HG 3) auf den Felsbändern, 4 Winterwölfe (je HG 3) am Boden | 4.200 | mittel |\n| Ebene 1 | Brutkammer | 2 Chimären (je HG 6) mit Gelege | 4.600 | mittel |\n| Abstieg | Sturmschacht | kein Kampf, Kletterpartie, einzige Raststelle | – | – |\n| Ebene 2 | Tiefhalle | Gifttroll (HG 7) mit 2 Trollen (je HG 5) | 6.500 | hoch |\n| Bossraum | Schatzkammer | **Schreckenstroll** (HG 13) | 10.000 | über hoch |\n\nRichtwerte (Regeln 2024, vier Kämpfer Stufe 8): niedrig 2.000, mittel\n4.400, hoch 8.400 EP. Die Gruppe spielt sehr starke Charaktere; der\nBossraum liegt mit Absicht darüber, wie die großen Ziele in Kapitel 4.\n\n**Leichter:** In der Windkammer nur zwei Winterwölfe; in der\nBrutkammer eine Chimäre; in der Tiefhalle nur ein Troll neben dem\nGifttroll. Den Schreckenstroll nicht abschwächen – lieber die Rast im\nSturmschacht großzügig geben.\n\n**Der Schlüssel zu Ebene 2 und zum Bossraum heißt Feuer.** Trolle\nregenerieren, solange niemand sie mit Feuer oder Säure trifft. Wer\nohne Feuer hinuntersteigt, kann sie nicht töten. Darum liegen am Fuß\ndes Sturmschachts zwei geborstene **Ölfässer der Horde** (vom\nKettentransport, → Kapitel 1c, Szene 2): je vier Flaschen Öl (1 Aktion\nwerfen, 1,5 m, Ziel brennt eine Runde lang: 5 Feuerschaden, oder auf\neine Waffe gestrichen: +1W4 Feuer für drei Treffer). Fackeln und\nFeuerzauber zählen natürlich auch.\n\n## Der Weg\n\n```\n Silberkanzel\n     │ Windspalte (20 m, schulterbreit, Athletik DC 12 pro Held)\n EBENE 1   [1] Windkammer (Mantikore + Winterwölfe) ── [2] Brutkammer (Chimären-Paar)\n     │ Sturmschacht (20 m / 65 Fuß abwärts, Athletik DC 13, Rast möglich)\n EBENE 2   [3] Tiefhalle (Gifttroll + 2 Trolle)\n     │ Gang (30 m, das Echo wird zur Glocke)\n BOSSRAUM  [4] Schatzkammer (Schreckenstroll, Silberzahn im Kristall)\n```\n\n## Ebene 1 – der Wind\n\n**Die Windspalte.** Kaum schulterbreit, 20 m lang, der Wind heult\nheraus. Athletik DC 12 pro Held; Misserfolg: 1W6 Wucht und zurück.\nMilo bleibt stecken und wird gezogen. In der\nSpalte kommen die Helden nur einzeln voran, und wer hinten steht,\nkann nicht an dem vorne vorbei zielen.\n\n**[1] Die Windkammer.** 15 m hoch, Felsbänder unter der Decke, am\nBoden Geröll und zwei große Felsblöcke. Auf den Bändern hocken die\n**zwei Mantikore** (→ [Kampfübersicht](#feinde-uebersicht)): Sie\nschießen Stacheln auf jeden, der aus der Spalte tritt. Hinter den\nFelsblöcken liegen die **vier Winterwölfe**\n(→ [Kampfübersicht](#feinde-uebersicht)); sie warten, bis der zweite\nHeld in der Kammer steht, dann greifen sie an – Biss wirft um,\nKälteodem aus zwei Richtungen, Rudeltaktik. Die Mantikore reden: Wer\nihnen Fleisch verspricht, kann sie mit Überzeugen DC 14 vorbeilocken;\ndie Wölfe hören auf niemanden. Wenn die Wölfe fallen, fliegen die\nMantikore durch die Spalte hinaus in den Sturm.\n\n**[2] Die Brutkammer.** 20 × 15 m, hohe Decke, Boden voller Knochen\n(Bergziegen, ein Greif mit Sattelresten, ein Goblin mit Kettennarbe).\nEin Nest aus Fellen und Federn an der Rückwand, darin **drei Eier**,\njedes so groß wie ein Schild. Die **zwei Chimären**\n(→ [Kampfübersicht](#feinde-uebersicht)) hören den Kampf in der\nWindkammer und erwarten die Helden am Eingang (kein Überraschungsangriff\nmöglich, außer die Gruppe hat die Mantikore vorbeigelockt und die\nWölfe leise erledigt: Heimlichkeit DC 15 für alle). Hinter dem Nest\nder Einstieg in den Sturmschacht, mit Knochen verbarrikadiert\n(Wahrnehmung DC 12, dann eine Minute Räumen).\n\n## Der Sturmschacht (Abstieg)\n\nEin Schacht, 20 m / 65 Fuß tief, die Wände glatt vom Wind. Der Wind\ndrückt von **unten** herauf: Fackeln gehen aus, Seile flattern, man\nhört die eigene Stimme von unten zurückkommen. Athletik DC 13 pro\nHeld (mit Seil: Vorteil); Misserfolg:\n2W6 Wucht, keine Toten – der Wind bremst den Sturz. Unten ist es\nplötzlich still, der Wind bleibt oben.\n\n**Rast:** Hier, und nur hier, ist eine kurze Rast sicher (eine\nStunde; jede Stunde zählt, → Kapitel 1c, Szene 5, Konsequenzen).\nAm Fuß des Schachts: die zwei **Ölfässer der Horde** (siehe oben) und\nSchleifspuren, die vom Schacht zur Tiefhalle führen und dort enden –\ndie Horde war hier, hat die Ketten geholt und ist wieder gegangen.\n**Vorlesetext fehlt** (Christoph, Schweizerdeutsch): der Abstieg und\ndie Stille unten.\n\n## Ebene 2 – die Tiefe\n\n**[3] Die Tiefhalle.** 30 × 12 m, niedrige Decke (4 m / 13 Fuß, kein\nFliegen), feuchter Fels, es ist wärmer als oben und stinkt nach Aas.\nDer Boden ist ein einziger Knochenhaufen, an den Wänden Kratzspuren in\nMannshöhe und weit darüber. Hier hausen der **Gifttroll** und seine\n**zwei Trolle** (→ [Kampfübersicht](#feinde-uebersicht)). Sie schlafen\nnicht; sie fressen. Die Trolle kommen mit Sturmangriff aus den\nNischen links und rechts, der Gifttroll bleibt in der Mitte, wo jeder,\nder ihn trifft, seine Giftspritzer abbekommt. Alle drei regenerieren –\n**Feuer oder Säure** stoppt es. Wer das nicht weiß, lernt es hier:\nEin Troll, der am Boden liegt und wieder aufsteht, ist der Moment, in\ndem der Erzähler auf die Ölfässer zeigt.\n**Vorlesetext fehlt** (Christoph): die Tiefhalle, bevor die Trolle\nsich rühren.\n\n**Der Gang.** Hinter der Tiefhalle ein Gang, 30 m, der sich zur\nSchatzkammer hin weitet. Jeder Schritt kommt dreimal zurück, und am\nEnde des Gangs klingt das Echo nicht mehr wie Fels, sondern wie Glas.\n\n## Bossraum – die Schatzkammer\n\n**[4] Die Schatzkammer.** Rund, 10 m / 33 Fuß im Durchmesser, 6 m\nhoch, die Wände aus geschliffenem Fels, der das Fackellicht\nhundertfach wirft. In der Mitte ein Kristallblock mit **Silberzahn**\nbis zum Heft darin. Berühren: 3W8 Blitzschaden, Konstitution DC 13\nhalbiert; dann zerspringt der Kristall, und die ganze Halle klingt\neinmal nach wie eine Glocke. Keine weiteren Fallen, kein Rätsel.\n\nHier lagert der **Schreckenstroll** (→ [Kampfübersicht](#feinde-uebersicht)), der\nVater der Sippe aus der Tiefhalle, der seine eigenen Jungen gefressen\nhat, wenn sie ihm zu nahe kamen. Er liegt hinter dem Kristall, und die\nSpiegelwände zeigen ihn hundertfach: Die Spieler sehen zuerst zwanzig\nTrolle und dann erst, dass es einer ist. Den Kristall kann er nicht\nöffnen; er weiß nicht, was er ist, und hat ihn in Ruhe gelassen. Wer\nden Kristall berührt, löst den Blitz **und** den Glockenschlag aus –\ndann ist der Troll wach. Wer sich im Spiegel ansieht, sieht sich kurz\nmit silbernen Augen – Stimmung, keine Regel.\n**Vorlesetext fehlt** (Christoph): der Bossraum, bevor der Troll sich\nerhebt.\n\n## Erzähler-Hinweis\n\nVier Räume, kein Hexfeld. Beschreib das Echo: Jedes Wort kommt\ndreimal zurück, auch die Lüge. Milo merkt das als Erster und redet\nleiser. Oben heult der Wind, unten ist es still und stinkt; der\nWechsel am Fuß des Schachts ist der Moment, in dem die Spieler\nmerken, dass sie nicht in einer Höhle sind, sondern in einem Bau.\nFeuer ist der rote Faden von Ebene 2 und Bossraum – sag es nicht, zeig\nes (die Ölfässer, der Troll, der wieder aufsteht).\n"}, "orte-felsenpass": {"title": "Felsenpass", "path": "Orte/Felsenpass.md", "md": "# Der Felsenpass\n\nSchauplatz der Kapitel 2–4: Ebene, Felswände, Geschütztürme.\n\n<img class=\"map\" src=\"Karten/18-Battlemap-Kampf-um-die-Tuerme.png\" alt=\"Battlemap – Kampf um die Türme\">\n\n*Battlemap – Kampf um die Türme*\n\n## Überblick\n\nEin zwei Kilometer breiter, flacher Talboden zwischen zwei steilen\nFelswänden – die einzige Straße von Nordgar nach Osten. Im Westen,\nein Stück vor den Bergen im offenen Land, Burg Rabenwacht; im Osten\nzieht sich der Pass an einem Felsvorsprung zur **Verengung** zusammen,\ndahinter liegt links der **Kessel** mit dem Hordenlager\n(→ [Hordenlager](#orte-hordenlager)), und rechts läuft die Schlucht **offen** ins\nLand vor Burg Veldgard aus – kein Tor, keine Schleuse. Rechts (südlich) der Felswände: das Sturmgebiet\n(→ [Sturmgebiet](#orte-sturmgebiet)).\n\n**Die Ebene:** Stoppelfelder, ein ausgetrockneter Bach, ein\nverbrannter Hof. Die Horde steht in der Mitte; das Heer Nordgars\ngreift von Westen an. Nichts bietet Deckung – deshalb entscheiden die\nTürme.\n\n## Die Türme\n\nDie „Türme\" sind **Geschützstellungen**, keine Gebäude: gemauerte\nPlattformen mit Brüstung, je einer Steintreppe und Ballisten obendrauf,\ndie den ganzen Talboden bestreichen. Nordgar hat sie vor Generationen\ngebaut, die Horde hat sie im Frühjahr genommen. In beiden Felswänden\nder Schlucht zieht sich etwa 90 m (300 Fuß) über dem Talboden ein\n**Felsband** entlang, breit genug für zwei Stellungen; auf jedes Band\nführt eine **Rampe** hinauf.\n\n**Links (Nordwand):** Zwei Stellungen – Aufgabe des Trupps Eisenwacht.\nDie Helden sehen sie nur aus der Ferne.\n\n**Rechts (Südwand):** Zwei Stellungen – Aufgabe der Helden\n(festgelegt 25.10.2026):\n\n- **Die Rampe:** Felspfad vom Nachschubpfad schräg hinauf aufs Band,\n  40 m (130 Fuß) lang, 3 m (10 Fuß) breit, links der Abgrund. Zwei\n  **Barrikaden** (halbe Höhe, Rampenkopf) aus Karren, Fässern, Pfählen.\n- **Das Felsband:** 12 m (40 Fuß) breit; links die Kante über der\n  Schlucht, rechts die Wand. Bolzenkisten, Fässer.\n- **Turm 1 rechts:** Plattform direkt am Rampenkopf, 9 × 9 m\n  (30 × 30 Fuß), 3 m (10 Fuß) hoch, eine Steintreppe mit Pechtopf.\n  Eine Ballista, hölzerner Beobachtungsstand (3 m höher) für den\n  Hobgoblin-Verwüster.\n- **Der Zwischenraum:** 7 m (22 Fuß) offenes Band zwischen den\n  Plattformen.\n- **Turm 2 rechts:** Plattform 12 × 9 m (40 × 30 Fuß), 4,5 m (15 Fuß)\n  hoch, eine Steintreppe, zwei Ballisten.\n\n**Besatzung** (Quelle für die Besatzungstabelle; Änderungen nur hier):\n\n| Stelle | Besatzung |\n|---|---|\n| **Rampe, untere Barrikade** | 2 Hobgoblin-Krieger, 1 Goblin-Boss |\n| **Rampe, obere Barrikade** | 2 Hobgoblin-Krieger, 1 Hobgoblin-Hauptmann, 1 Oger-Kettenschläger |\n| **Turm 1 rechts** | 2 Hobgoblin-Krieger, 1 Hobgoblin-Hauptmann, 2 Bogenschützen, 2 Oger-Bolzenschleudern, 1 Hobgoblin-Verwüster |\n| **Der Zwischenraum** | 3 Hobgoblin-Eisenschatten |\n| **Turm 2 rechts** | 2 Hobgoblin-Krieger, 1 Hobgoblin-Hauptmann, 1 Oger-Kettenschläger, 1 Champion |\n\n**Die Skizze der Greifenreiter** (→ Kapitel 1): zeigt beide Türme,\ndie Rampe mit zwei Strichen („Karren!\"), die beiden Plattformen dicht\nnebeneinander – auf Turm 2 rechts zwei Kreuze mit „ZWEI!\" (die\nbeiden Ballisten) und auf Turm 1 rechts ein Fragezeichen mit\n„MAGIER?\" (die Greifenreiter haben Blitze vom Turm gesehen).\n\n**Der Krähenkamm:** Felsabsatz 300 m unter dem Turm 1 rechts. So weit\nfliegen die Greifen (→ Kapitel 2). Von hier: Nebelsteig oder\nNachschubpfad, Wachposten, dann die Rampe.\n\n## Ballisten\n\n→ [Geschütze](#regeln-geschuetze). Reichweite: der ganze Talboden; Ziele in der\nLuft (die roten Drachen) bis 300 m.\n\n## Die drei Stellungen der Horde (Kapitel 4)\n\nAuf der Ebene, je 30–40 m auseinander, zeichne ein Dreieck:\n- **Der Fäulnistroll** mit dem Banner und dem Kriegspriester im Korb **links** (Nordrand), auf\n  einem Hügel aus Bachgeröll.\n- **Die Hellfire Engine** (die Höllenfeuer-Maschine mit dem Kessel) in\n  der **Mitte**, walzt nach Westen in den Keil des Heeres.\n- **Der Feuerriese** **rechts** (Südrand), unterhalb der\n  Geschütztürme.\n\n„Links\" und „rechts\" vom Heer aus gesehen, also mit Blick nach Osten\nin den Pass.\n\nZwischen den Stellungen: Horde (→ [Kampfübersicht](#feinde-uebersicht), Hordenregel).\nDie Landezone der Greifen liegt hinter dem Keil des Heeres, 40 m\nwestlich der Hellfire Engine.\n"}, "orte-hordenlager": {"title": "Hordenlager", "path": "Orte/Hordenlager.md", "md": "# Das Hordenlager\n\nSchauplatz von Kapitel 5: kampflose Einnahme der Verengung, eigenes Lager, Rast, Siegestrunk. Kein Kampf in diesem Kapitel.\n\n## Überblick\n\nHinter der Ebene schiebt sich von links ein **Felsvorsprung** ins Tal\nund drückt den Pass auf eine **Verengung** zusammen – ein paar Dutzend\nSchritte breit, zwischen Fels und Felsgrat. Dahinter öffnet sich das\nTal wieder in zwei Richtungen: Links liegt der **Kessel**, eine vom\nFels umschlossene Bucht, eine Sackgasse. Rechts, um eine Felsnase\nherum, läuft die Schlucht weiter und **offen** ins Land vor Burg\nVeldgard aus. Kein Tor, keine Mauer, keine Schleuse.\n"}, "orte-sturmgebiet": {"title": "Sturmgebiet", "path": "Orte/Sturmgebiet.md", "md": "# Das Sturmgebiet\n\n*(Wird später ergänzt.)*\n"}, "karten-karten": {"title": "Karten", "path": "Karten/Karten.md", "md": "# Karten: Die letzte Grosstat\n\nDie gemalte Regionskarte von Nordgar, drei Skizzen für den Spielleiter, die Karte von Burg Veldgard und sechs gemalte Kampfkarten (Battlemaps) für den Drachenhort, nach Christophs Vorlagen vom 21. Oktober 2026. Ausrichtung wie in den Vorlagen (Berg links, Sturm rechts; Burg mit Tor oben und Tor unten).\nKursiv mit (?) = aus der Skizze herausgelesen, nicht festgelegt.\nÖffnen: `Karten.html` im Browser (alle mit Legende) oder die einzelnen `.svg`- und `.png`-Dateien.\n\nFestgelegt (21.10.2026): Rabenwacht steht nicht am Eingang der Schlucht; die Schlucht hat am Ende kein Tor und keine Schleuse, sondern läuft offen aus.\n\n\n## Nordgar, gemalt (`04-Region-Nordgar.png`)\n\n<img class=\"map\" src=\"Karten/04-Region-Nordgar.png\" alt=\"04-Region-Nordgar.png\">\n\n**Die Länder:**\n\n- **Nordgar** – Hauptstadt Dunmar; Marschallin Hedda Eisenbrecht (→ [Beschreibung](#npc-marschallin-hedda-beschreibung))\n- **Sildoras** – Ritter Aurel Vanthis, die Sonnenlanzen (→ [Beschreibung](#npc-die-verbuendeten-beschreibung))\n- **Dhurgan** – Brannok Grauhammer, die Hammergarde\n- **Skarn** – Thuluk Wolkentreter, die Goliaths\n- **Thalvien** – Hauptfrau Sarenne Ilwyn, die Grünpfeile\n\n## Burg Rabenwacht (`01-Burg-Rabenwacht.svg`)\n\n<img class=\"map\" src=\"Karten/01-Burg-Rabenwacht.svg\" alt=\"01-Burg-Rabenwacht.svg\">\n\nNur die Burg, nach Christophs Skizze: zwei Tore, Kernburg in der Mitte, Seitenhöfe, Rundbogen.\n\n- [1] **Tor oben und Torhof:** Das obere Tor führt in einen Vorhof, der sich nach aussen zu den beiden Ecktürmen weitet. Von dort geht es durch ein zweites Tor in die Kernburg.\n- [2] **Kernburg mit Innenhof:** Zwei Gebäude flankieren den Eingang, dahinter der Innenhof; die Mauern weiten sich bis zu den mittleren Türmen.\n- [3] **Seitenhöfe:** Links und rechts der Kernburg je ein Hof innerhalb der Aussenmauer, mit einem Langbau (Ställe, Werkstätten oder Ähnliches).\n- [4] **Rundbogen:** Der Bogen am unteren Ende des Innenhofs, der zur Torhalle überleitet.\n- [5] **Torhalle und Tor unten:** Ein Durchgang mit Kammern zu beiden Seiten, am Ende das untere Tor.\n- [6] **Treppen:** Die Querstriche an den Mauern in deiner Skizze lese ich als Treppen auf den Wehrgang.\n- [7] **Brunnen (?):** Das kleine Rechteck mitten im Innenhof, gezeichnet als Brunnen oder Trog.\n- **Noch ohne Zuordnung:** Rittersaal, Keller, Schmiede, Ställe und Toms Wagen trage ich ein, sobald du sagst, wo sie liegen.\n\n## Das Schlachtfeld (`02-Schlachtfeld-Gelaende.svg`)\n\n<img class=\"map\" src=\"Karten/02-Schlachtfeld-Gelaende.svg\" alt=\"02-Schlachtfeld-Gelaende.svg\">\n\nNur das Gelände: Berg links, Sturm rechts, dazwischen das Tal mit Verengung und offenem Ausgang. Ohne Türme und Heere.\n\n- [1] **Berg:** Das Felsmassiv links. Die Schraffur zeigt die Steilhänge zum Tal.\n- [2] **Hügel (?):** Die Kreise oben in deiner Skizze. Ich lese sie als Hügel oder Felsbrocken am Eingang der Ebene.\n- [3] **Ebene (?):** Der breite, offene Teil des Tals. Hier hätte die Schlacht Platz.\n- [4] **Felsvorsprung (?):** Der Vorsprung unten links, der ins Tal ragt.\n- [5] **Verengung (?):** Die engste Stelle, zwischen Felsvorsprung und Felsgrat.\n- [6] **Kessel (?):** Unten links eine vom Fels umschlossene Bucht, eine Sackgasse. Rechts davon, um die Felsnase herum, führt das Tal weiter.\n- [7] **Ausgang, offen:** Die Schlucht läuft offen aus, ohne Tor und ohne Schleuse.\n- [8] **Felsgrat:** Der Grat rechts, zwischen Tal und Sturmgebiet.\n- [9] **Sturm:** Wolken und Blitze rechts des Grats, Argentys' Himmel.\n- **Weggelassen:** Türme und Heere, wie gewünscht. Auch die kleinen Kreise an den Talwänden in deiner Skizze; wenn das Turmstandorte sind, sag es.\n\n## Die ganze Region (`03-Region-Uebersicht.svg`)\n\n<img class=\"map\" src=\"Karten/03-Region-Uebersicht.svg\" alt=\"03-Region-Uebersicht.svg\">\n\nWeiter weg: Rabenwacht im offenen Land, der Pass mit demselben Gelände wie auf Karte 2, das Sturmgebiet, Veldgard am offenen Ende.\n\n- [1] **Burg Rabenwacht:** Steht jetzt ein Stück vor den Bergen im offenen Land, nicht mehr am Eingang der Schlucht. Eine Strasse führt zum Pass.\n- [2] **Ebene:** Der breite Eingang des Tals mit den Hügeln. Hier die Schlacht.\n- [3] **Verengung:** Die engste Stelle am Felsvorsprung.\n- [4] **Schlucht, am Ende offen:** Hinter der Verengung weitet sich das Tal und läuft offen ins Land vor Veldgard aus. Keine Schleuse, kein Tor.\n- [5] **Burg Veldgard:** Am offenen Ende des Passes, im grünen Veldaren am Fluss (früher «Nachtzinne»). Ziel von Kapitel 6.\n- **Nicht auf der Karte:** Die Hauptstadt Dunmar liegt weit im Süden Nordgars; bis vor ihre Tore kam die Horde.\n- [6] **Sturmgebiet:** Das Hochtal rechts des Felsgrats unter der Wolkenwand. Die Silberkanzel am Rand ist der Landeplatz des Boten.\n- **Vorschlag:** Lage von Rabenwacht und Veldgard sowie die Entfernungen sind mein Vorschlag; die Schlucht in der Mitte ist dieselbe wie auf Karte 2.\n\n## Burg Veldgard (`05-Burg-Veldgard.png`)\n\n<img class=\"map\" src=\"Karten/05-Burg-Veldgard.png\" alt=\"05-Burg-Veldgard.png\">\n\nVon Christoph am 1.11.2026 geliefert. Schauplatz von Kapitel 6 (→ [Burg Veldgard](#orte-burg-veldgard)).\n\n## Der Drachenhort – Kampfkarten (Karten 6 bis 11)\n\nSechs Battlemaps für den Dungeon aus Kapitel 1c (→ [Drachenhort](#orte-drachenhort)), gemalt mit einem Bildmodell am 27.10.2026: Draufsicht, Höhlenstil, mit einem 5-Fuss-Raster (ein Feld = 1,5 m) für Figuren oder einen Bildschirm. Keine Beschriftung auf den Bildern; wer wo steht, steht hier in der Legende. Die Karten zeigen keine Gegner, damit sie auch nach dem Kampf brauchbar bleiben. Zu jedem Raum liegt eine zweite Fassung unter `Echohallen-Varianten\\`.\n\nGrössen sind Spielmass, nicht nachgemessen: Ein Feld ist 5 Fuss / 1,5 m. Wer die Bilder ausdruckt, druckt sie so, dass ein Feld einen Zoll (2,54 cm) misst, dann passen gewöhnliche Miniaturen.\n\n## Ebene 1, Übersicht (`06-Echohallen-Ebene-1.png`)\n\n<img class=\"map\" src=\"Karten/06-Echohallen-Ebene-1.png\" alt=\"06-Echohallen-Ebene-1.png\">\n\nDie ganze obere Ebene auf einem Blatt, von der Silberkanzel bis zum Schacht. Für den Überblick am Spieltisch; für die Kämpfe die Einzelkarten 7 und 8.\n\n- **Oben:** die Windspalte, 20 m lang und schulterbreit (Athletik DC 12 pro Held). Nur einzeln vorwärts, wer hinten steht, zielt nicht an dem vorne vorbei.\n- **Mitte:** die Windkammer mit den zwei Felsblöcken (Deckung für die Winterwölfe) und den Felsbändern unter der Decke (die Mantikore).\n- **Unten:** die Brutkammer, Knochenboden, das Nest mit den drei Eiern an der Rückwand, davor das Loch in den Sturmschacht.\n\n## Ebene 1, Windkammer (`07-Echohallen-Windkammer.png`)\n\n<img class=\"map\" src=\"Karten/07-Echohallen-Windkammer.png\" alt=\"07-Echohallen-Windkammer.png\">\n\nErster Kampf: 2 Mantikore oben, 4 Winterwölfe unten (→ [Kampfübersicht](#feinde-uebersicht), [Kampfübersicht](#feinde-uebersicht)).\n\n- **Links:** die Windspalte mündet in die Kammer. Hier tritt der erste Held heraus, und die Mantikore lassen Stacheln regnen.\n- **Felsbänder oben:** die hellen Terrassen an der oberen Wand, 10 bis 12 m über dem Boden (die Kammer ist 15 m hoch). Hier hocken die Mantikore; wer hinauf will, klettert (Athletik DC 15) oder fliegt. Die eingeschlagenen Stacheln am Rand sind Stimmung.\n- **Die zwei Felsblöcke unten:** Dreiviertel-Deckung. Dahinter liegen die Winterwölfe und warten, bis der zweite Held in der Kammer steht. Kälteodem aus zwei Richtungen.\n- **Rechts:** der Durchgang zur Brutkammer. Fallen die Wölfe, fliegen die Mantikore durch die Spalte hinaus in den Sturm.\n- Schnee und Frost am Boden sind nur Bild, kein schwieriges Gelände.\n\n## Ebene 1, Brutkammer (`08-Echohallen-Brutkammer.png`)\n\n<img class=\"map\" src=\"Karten/08-Echohallen-Brutkammer.png\" alt=\"08-Echohallen-Brutkammer.png\">\n\nZweiter Kampf: 2 Chimären mit Gelege . 20 × 15 m, hohe Decke.\n\n- **Links:** der Gang aus der Windkammer. Die Chimären haben den Kampf gehört und erwarten die Gruppe am Eingang, zwei Feueratem-Kegel, wenn alle im Gang stehen.\n- **Knochen:** Bergziegen, der Greif mit Sattelresten (Mitte), der Goblin mit der Kette (unten links). Stimmung; der Boden zählt nicht als schwieriges Gelände, ausser der Erzähler will es so.\n- **Das Nest oben rechts:** Felle und Federn, drei Eier so gross wie Schilde. Die Chimären verteidigen es bis zum Tod; wer die Eier bedroht, zieht beide auf sich.\n- **Das Loch neben dem Nest:** der Einstieg in den Sturmschacht, auf dem Bild offen gezeichnet. Im Spiel ist es mit Knochen verbarrikadiert (Wahrnehmung DC 12, eine Minute Räumen).\n\n## Abstieg, Fuss des Sturmschachts (`09-Echohallen-Sturmschacht.png`)\n\n<img class=\"map\" src=\"Karten/09-Echohallen-Sturmschacht.png\" alt=\"09-Echohallen-Sturmschacht.png\">\n\nKein Kampf. Die Stelle, an der die Gruppe nach 20 m / 65 Fuss Abstieg ankommt (Athletik DC 13, Misserfolg 2W6 Wucht) und wo die einzige sichere Rast ist.\n\n- **Mitte:** die Schachtöffnung von oben gesehen, glattgeschliffen vom Wind. Hier kommt die Gruppe am Seil herunter. Von oben heult der Wind, hier unten ist es still.\n- **Rechts:** die zwei geborstenen Ölfässer der Horde mit den Öllachen, dazu Seilreste und eine abgebrannte Fackel. Je vier Flaschen Öl pro Fass (→ [Drachenhort](#orte-drachenhort)). Sag es nicht vorher, zeig es, wenn der erste Troll wieder aufsteht.\n- **Fussspuren und Schleifspuren:** führen vom Schacht zum Gang oben, in die Tiefhalle. Die Horde war hier und ist wieder gegangen.\n- **Unten:** eine Feuerstelle und Reste eines Lagers. Der Rastplatz.\n- **Oben:** der Gang zur Tiefhalle.\n\n## Ebene 2, Tiefhalle (`10-Echohallen-Tiefhalle.png`)\n\n<img class=\"map\" src=\"Karten/10-Echohallen-Tiefhalle.png\" alt=\"10-Echohallen-Tiefhalle.png\">\n\nDritter Kampf: Gifttroll und 2 Trolle (→ [Kampfübersicht](#feinde-uebersicht)). 30 × 12 m, Decke nur 4 m / 13 Fuss, kein Fliegen.\n\n- **Links:** der Gang vom Sturmschacht. Die Gruppe steht erst in der Halle, dann rühren sich die Trolle.\n- **Nischen oben und unten:** die dunklen Alkoven in den Längswänden sind die Trollhöhlen. Aus den Nischen kommen die zwei Trolle mit Sturmangriff, 3 m Reichweite, drei Reissen-Angriffe je Runde.\n- **Mitte:** die grüne Lache und der Fleischhaufen. Hier bleibt der Gifttroll; wer ihn trifft, bekommt Giftspritzer (2W8 Gift auf alle in 1,5 m). Die Lache ist Stimmung, kein Gift.\n- **Rechts:** der Gang zum Bossraum, 30 m, das Echo wird zur Glocke.\n- Der Knochenboden ist schwieriges Gelände, wenn der Erzähler es will (halbe Bewegung); die Trolle stört er nicht.\n\n## Bossraum, Schatzkammer (`11-Echohallen-Spiegelkammer.png`)\n\n<img class=\"map\" src=\"Karten/11-Echohallen-Spiegelkammer.png\" alt=\"11-Echohallen-Spiegelkammer.png\">\n\nEndboss: der Schreckenstroll (→ [Kampfübersicht](#feinde-uebersicht)). Rund, 10 m / 33 Fuss im Durchmesser, 6 m hoch.\n\n- **Unten:** der Gang aus der Tiefhalle, der einzige Zugang. Wer hier stehen bleibt, hat den Troll nicht im Rücken, aber auch keinen Platz.\n- **Die Wände:** geschliffener Fels, der das Fackellicht hundertfach wirft. Die Spieler sehen zuerst zwanzig Trolle, dann einen. Wer hineinsieht, sieht sich kurz mit silbernen Augen (Stimmung, keine Regel).\n- **Mitte:** der Kristallblock mit Silberzahn bis zum Heft darin. Berühren: 3W8 Blitz (Konstitution DC 13 halbiert), dann zerspringt der Kristall mit einem Glockenschlag, und der Troll ist wach. Der Block ist Dreiviertel-Deckung, solange er steht.\n- **Oben:** das Lager aus Knochen und Fellen hinter dem Kristall. Hier schläft der Schreckenstroll, bis jemand den Kristall berührt oder ihn angreift.\n- Klauenwirbel trifft alles in 3 m, also zwei Felder rund um den Troll. In der engen Kammer ist das fast der halbe Raum: Wer schiesst, bleibt am Rand.\n\nDer Endgegner in Veldgard ist Kazzamir, der Gehörnte (ein Gehörnter Teufel); auf den Karten heisst er nur «Anführer der Horde».\n\n## Burg Rabenwacht – Bilder (`12-Burg-Rabenwacht-Aussen.png`, `13-Burg-Rabenwacht-Ebene-1.png`, `14-Burg-Rabenwacht-Ebene-2.png`)\n\nVon Christoph am 1.11.2026 geliefert: Aussenansicht der Burg sowie die Grundrisse Ebene 1 und Ebene 2. Eingebunden auf der Seite [Burg Rabenwacht](#orte-burg-rabenwacht).\n\n## Drachenhort – Bilder (`15-Drachenhort-Ebene-1.png`, `16-Drachenhort-Ebene-2.png`, `17-Drachenhort-Schatzkammer.png`)\n\nVon Christoph am 1.11.2026 geliefert: Ebene 1, Ebene 2 und Bossraum – Schatzkammer. Eigene Seite [Drachenhort](#karten-drachenhort), zusätzlich auf [Drachenhort](#orte-drachenhort).\n\n## Battlemap – Kampf um die Türme (`18-Battlemap-Kampf-um-die-Tuerme.png`)\n\n<img class=\"map\" src=\"Karten/18-Battlemap-Kampf-um-die-Tuerme.png\" alt=\"18-Battlemap-Kampf-um-die-Tuerme.png\">\n\nVon Christoph am 1.11.2026 geliefert. Eingebunden auf der Seite [Felsenpass](#orte-felsenpass).\n\n## Battlemap – Kellergang, erster Kampf (`19-Battlemap-Kellergang.png`)\n\n<img class=\"map\" src=\"Karten/19-Battlemap-Kellergang.png\" alt=\"19-Battlemap-Kellergang.png\">\n\nVon Christoph am 1.11.2026 geliefert. Eingebunden auf der Seite [Der Fluchtgang](#orte-der-fluchtgang) (Kapitel 1b).\n"}, "karten-drachenhort": {"title": "Drachenhort", "path": "Karten/Drachenhort.md", "md": "# Drachenhort\n\n<img class=\"map\" src=\"Karten/15-Drachenhort-Ebene-1.png\" alt=\"Ebene 1\">\n\n*Ebene 1*\n\n<img class=\"map\" src=\"Karten/16-Drachenhort-Ebene-2.png\" alt=\"Ebene 2\">\n\n*Ebene 2*\n\n<img class=\"map\" src=\"Karten/17-Drachenhort-Schatzkammer.png\" alt=\"Bossraum – Schatzkammer\">\n\n*Bossraum – Schatzkammer*\n"}, "regeln-geschuetze": {"title": "Geschütze", "path": "Regeln/Geschuetze.md", "md": "# Geschütze und Drachenjagd\n\nDie Ballisten auf den Türmen des Felsenpasses und die Szene, in der die\nHelden damit die drei jungen roten Drachen vom Himmel holen (Kapitel 3,\nSzene 4, sobald Turm 2 rechts gefallen ist). Alles läuft **mit\nInitiative** wie ein normaler Kampf: Drachen und Helden würfeln, die\nVeteranen-Gruppen handeln am Ende jeder Runde.\n\n## Die Geschütze (Ballisten)\n\n| | |\n|---|---|\n| Objekt | Groß, RK 15, 50 TP |\n| Auf Turm 2 rechts | **zwei Ballisten** = zwei Schüsse pro Runde (die Ballista von Turm 1 rechts steht 7 m weiter) |\n| Bedienung | Schütze und Lader: ein Schuss **jede Runde**; allein braucht ein Held drei Runden pro Schuss |\n| Angriff | **1W20+6** (oder der eigene Fernkampfbonus, wenn höher und mit Belagerungsgerät geübt) |\n| Treffer gegen einen Drachen | Trefferwurf gegen **15**; getroffen = **1 Treffer**; **natürliche 19 oder 20 = Drache sofort tot** |\n| Schaden gegen alles andere | 3W10 Stich, Reichweite 36/144 m, Luftziele bis 90 m |\n\n- Beschädigte Ballista richten: Handwerkszeug DC 15, eine Aktion.\n- Solange zwei Goblins eine Ballista bedienen, schießt die Horde damit\n  jede zweite Runde auf das Heer.\n\n## Die Drachen\n\nDrei junge rote Drachen (Werte → [Kampfübersicht](#feinde-uebersicht)). In dieser Szene\nhaben sie **keine Trefferpunkte**, sondern einen Trefferzähler:\n**zwei Treffer, und der Drache stürzt** in die Horde (3W10 Wucht auf\nalles in 3 m). Treffer gibt es durch die Ballisten (oben) oder durch\nWaffen und Zauber der Helden: je **60 Punkte Schaden = 1 Treffer**\n(Feuer tut ihnen nichts).\n\nJeder Drache macht in seinem Zug **einen** von zwei Angriffen:\n\n| Angriff | Wurf | Wirkung |\n|---|---|---|\n| **Feueratem** | kein Wurf | **20 Schaden** fest auf **eine** Veteranen-Gruppe; nur gegen die Soldaten |\n| **Sturzflug** | **+10** | auf eine Ballista (RK 15): Treffer = beschädigt, zweiter Treffer = zerstört, Bedienung GES DC 15 oder 2W6+6 Hieb plus 1W6 Feuer; **oder** auf eine Gruppe (RK 17): **25 Schaden** |\n\nNach dem Sturzflug bleibt der Drache bis zu seinem nächsten Zug dort:\nvor dem Turm (Ballisten schießen auf ihn **mit Vorteil**, Nahkämpfer\nerreichen ihn, RK 18) oder tief über der Gruppe. Wen ein Drache\nangreift, entscheidet der Erzähler jeden Zug neu.\n\n## Die fünf Veteranen-Gruppen (Schildträger)\n\nFünf Gruppen à 20 Veteranen mit Schilden stehen auf der Ebene unter den\nDrachen (Werte → [Stats](#npc-soldaten-und-trupp-eisenwacht-stats-stats)).\n\n| | |\n|---|---|\n| Gruppen | 5 |\n| RK | 17 |\n| Pool | **65 pro Gruppe** (fünf Zettel) |\n| Angriff | **+5**, Treffer **12 Schaden** auf den Zähler des Drachen |\n| Wann | **am Ende jeder Runde**, jede stehende Gruppe einmal, auf einen Drachen, der in dieser Runde tief über sie geflogen ist (Feueratem oder Sturzflug auf die Soldaten) |\n\nJeder Drachenangriff trifft nur **eine** Gruppe. Ist ihr Pool auf 0,\nist die Gruppe weg. Was steht, geht in Kapitel 4 mit.\n\n## Rundenablauf\n\n1. Initiative: Helden schießen (1W20+6 gegen 15) oder greifen einen\n   hängenden Drachen an; jeder Drache macht Feueratem oder Sturzflug.\n2. Ende der Runde: die Veteranen-Gruppen schlagen zurück (+5 gegen 18,\n   12 auf den Zähler). Pools nachführen.\n3. Zählen: zwei Treffer = Drache stürzt. Fallen alle drei, kommen die\n   Greifen und holen die Helden zur Schlacht (Kapitel 4).\n\n**Zu leicht:** Feueratem 25 statt 20, oder der größte Drache fällt erst\nbei 3 Treffern. **Zu hart:** Veteranen treffen mit +7.\n"}, "quests-hauptquest-die-letzte-grosstat": {"title": "Hauptquest Die letzte Großtat", "path": "Quests/Hauptquest-Die-letzte-Grosstat.md", "md": "# Hauptquest: Die letzte Großtat\n\n**Ziel:** Die Horde schlagen, Burg Veldgard nehmen, den\nAnführer besiegen – und Nordgar befreien.\n\n## Quest-Etappen (mit Verweisen)\n\n1. **Kriegsrat und Siegesfeier** – Rabenwacht, der Auftrag, die Frage\n   nach dem Sturmgebiet, Milos Eintopf, Tränke, Schliffe, der Spion → `Story/Erzaehler/01-Siegesfeier-und-Kriegsrat.md`\n2. **Der Weg zu den Türmen** – Greifenflug, Krähenkamm, Geröll,\n   Wachposten, Leiter → `Story/Erzaehler/02-Der-Weg-zu-den-Tuermen.md`\n3. **Die Geschütztürme** – Rampe, Turm 1 rechts, Zwischenraum, Turm 2 rechts; die Drachen\n   vom Himmel holen → `Story/Erzaehler/03-Die-Geschuetztuerme.md`\n4. **Die Schlacht auf der Ebene** – zurück oder mitkämpfen; die\n   Feuerbälle; die drei großen Ziele\n   → `Story/Erzaehler/04-Die-Schlacht-auf-der-Ebene.md`\n5. **Das Hordenlager** – die Verengung nehmen, rasten, Heddas Plan\n   → `Story/Erzaehler/05-Das-Hordenlager.md`\n6. **Sturm auf Veldgard** – über die Mauer, die große Halle, der\n   Anführer → `Story/Erzaehler/06-Sturm-auf-Veldgard.md`\n7. **Nach der Schlacht** – der Preis, das Totenfeuer, Milos Abschied\n   → `Story/Erzaehler/07-Nach-der-Schlacht.md`\n\n## Belohnung\n\n- Toms Tränke, Orvins Schliffe, Feuerpfeile → [Übersicht](#belohnungen-uebersicht)\n- **Kein Stufenaufstieg** (die Helden bleiben auf Stufe 8, damit sie\n  sich in jede Kampagne mitnehmen lassen). Wer trotzdem belohnen will: ein Talent aus der Liste in\n  [Übersicht](#belohnungen-uebersicht), „Statt Stufe\".\n\n## Die Sanduhr\n\nKeine. Dieser Oneshot hat keinen Zeitdruck über Tage – die Schlacht\nist **heute**, Veldgard ist **morgen**. Der Druck kommt aus der\nSchlacht selbst, nicht aus dem Kalender.\n"}, "belohnungen-uebersicht": {"title": "Übersicht", "path": "Belohnungen/Uebersicht.md", "md": "# Belohnungen – Übersicht\n\n## Toms Tränke (Kapitel 1 und 5)\n\n→ [Handout Toms Tränke](#npc-druide-tom-handout-toms-traenke): 12 Tränke (inkl. 2× Trank\ndes Feueratems, für die Trolle im Drachenhort), dazu Toms Giftschrank\n(14 Gifte, eines pro Held). Zwei pro Held am Abend, zwei für die Gruppe\nim Hordenlager. Werte nach dem Spielleiterhandbuch 2024.\n\n## Orvins Schliffe (Kapitel 1, Nacht)\n\n**Für jeden Helden**, über Nacht, gültig **bis zum Ende von Kapitel 7**:\n\n| Schliff | Wer | Wirkung |\n|---|---|---|\n| **Scharf** (Waffenschliff) | jeder Held | Eine Waffe: +1 auf Angriff und Schaden. Keine Waffe wird dadurch besser als **+2** (wer schon +1 hat, kommt auf +2; wer +2 hat, bekommt nichts mehr). |\n| **Glutschild** | jeder, der einen Schild tragen will | Ein Schild (nur Schilde, nicht Rüstung oder Umhang): Wer ihn **vor der Schlacht aktiviert** (Aktion, ein Schlag mit der Faust auf die Glutrune), hat **10 Stunden** Resistenz gegen Feuer. Reicht für Türme und Ebene – im Finale in Veldgard ist die Glut erloschen. |\n\n## Feuerpfeile\n\nKarte `Trankkarten/12-Feuerpfeile.png`: **12 Pfeile** mit Glutrune,\neinmal für die Gruppe. Trifft ein Feuerpfeil, macht er zusätzlich\n**3W6 Feuerschaden**; der Pfeil verbrennt dabei. Ein gezogener Pfeil\nleuchtet, im Dunkeln ist der Schütze sichtbar. Gedacht für den\nSchreckenstroll (Todesstoß braucht 10 Feuer oder Säure in einem\nTreffer).\n"}, "monsterboegen-monsterkarten": {"title": "Monsterkarten", "path": "Monsterboegen/Monsterkarten.md", "md": "# Monsterkarten\n\nDruckfassung: `Monsterboegen/Monsterboegen-A4-alle.pdf` (A4-Bögen), `Monsterboegen/Monsterkarten-klein-alle.pdf` (Viertel-A4-Karten), einzelne PDFs daneben.\n\n## A4-Bögen, ein Monster pro Blatt\n\n<div class=\"bogen-grid\">\n<figure><img src=\"Monsterboegen/01-Uralter-Silberdrache-Argentys.png\" alt=\"Uralter Silberdrache Argentys\"><figcaption>Uralter Silberdrache Argentys<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/02-Hoellenfeuer-Maschine.png\" alt=\"Höllenfeür Maschine\"><figcaption>Höllenfeür Maschine<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/03-Assassine.png\" alt=\"Assassine\"><figcaption>Assassine<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/04-Bugbear-Krieger.png\" alt=\"Bugbear Krieger\"><figcaption>Bugbear Krieger<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/05-Bugbear-Pirscher.png\" alt=\"Bugbear Pirscher\"><figcaption>Bugbear Pirscher<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/06-Feuerriese.png\" alt=\"Feürriese\"><figcaption>Feürriese<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/07-Faeulnistroll.png\" alt=\"Fäulnistroll\"><figcaption>Fäulnistroll<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/08-Kriegspriester.png\" alt=\"Kriegspriester\"><figcaption>Kriegspriester<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/09-Gehoernter-Teufel.png\" alt=\"Gehörnter Teufel\"><figcaption>Gehörnter Teufel<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/10-Schreckenstroll.png\" alt=\"Schreckenstroll\"><figcaption>Schreckenstroll<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/11-Champion.png\" alt=\"Champion\"><figcaption>Champion<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/12-Gifttroll.png\" alt=\"Gifttroll\"><figcaption>Gifttroll<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/13-Chimaere.png\" alt=\"Chimäre\"><figcaption>Chimäre<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/14-Wyvern.png\" alt=\"Wyvern\"><figcaption>Wyvern<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/15-Hobgoblin-Verwuester.png\" alt=\"Hobgoblin Verwüster\"><figcaption>Hobgoblin Verwüster<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/16-Ausgewachsener-Silberdrache.png\" alt=\"Ausgewachsener Silberdrache\"><figcaption>Ausgewachsener Silberdrache<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/17-Junger-Silberdrache.png\" alt=\"Junger Silberdrache\"><figcaption>Junger Silberdrache<\/figcaption><\/figure>\n<\/div>\n\n## Viertel-A4-Karten, vier pro Blatt\n\n<div class=\"bogen-grid\">\n<figure><img src=\"Monsterboegen/K1-Goblins-und-Hobgoblins.png\" alt=\"Goblins und Hobgoblins\"><figcaption>Goblins und Hobgoblins<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/K2-Hobgoblins-Ork-Berserker.png\" alt=\"Hobgoblins Ork Berserker\"><figcaption>Hobgoblins Ork Berserker<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/K3-Woelfe-und-Mantikor.png\" alt=\"Wölfe und Mantikor\"><figcaption>Wölfe und Mantikor<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/K4-Oger-Bogenschuetze-Troll.png\" alt=\"Oger Bogenschütze Troll\"><figcaption>Oger Bogenschütze Troll<\/figcaption><\/figure>\n<figure><img src=\"Monsterboegen/K5-Bugbears-Hoellenhund-Greif.png\" alt=\"Bugbears Höllenhund Greif\"><figcaption>Bugbears Höllenhund Greif<\/figcaption><\/figure>\n<\/div>\n"}, "trankkarten-trankkarten": {"title": "Trankkarten", "path": "Trankkarten/Trankkarten.md", "md": "# Trankkarten\n\nDruckfassung: `Trankkarten/Druckbogen-Trankkarten-A4.pdf`, `Trankkarten/Nachdruck/Druckbogen-Nachdruck-A4.pdf`, `Trankkarten/Feuer/Druckbogen-Feuer-A4.pdf` (Feueratem und Feuerpfeile), `Trankkarten/Gifte/Druckbogen-Giftkarten-A4.pdf`.\n\n## Toms Tränke\n\n<div class=\"karten-grid\">\n<figure><img src=\"Trankkarten/01-Heiltrank.png\" alt=\"Heiltrank\"><figcaption>Heiltrank<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/02-Grosser-Heiltrank.png\" alt=\"Großer Heiltrank\"><figcaption>Großer Heiltrank<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/03-Vorzueglicher-Heiltrank.png\" alt=\"Vorzüglicher Heiltrank\"><figcaption>Vorzüglicher Heiltrank<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/04-Trank-der-Heldenhaftigkeit.png\" alt=\"Trank der Heldenhaftigkeit\"><figcaption>Trank der Heldenhaftigkeit<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/05-Trank-der-Riesenstaerke.png\" alt=\"Trank der Riesenstärke\"><figcaption>Trank der Riesenstärke<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/06-Trank-des-Fliegens.png\" alt=\"Trank des Fliegens\"><figcaption>Trank des Fliegens<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/07-Trank-der-Unsichtbarkeit.png\" alt=\"Trank der Unsichtbarkeit\"><figcaption>Trank der Unsichtbarkeit<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/08-Trank-des-Wachstums.png\" alt=\"Trank des Wachstums\"><figcaption>Trank des Wachstums<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/09-Trank-der-Verkleidung.png\" alt=\"Trank der Verkleidung\"><figcaption>Trank der Verkleidung<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/10-Trank-der-Vitalitaet.png\" alt=\"Trank der Vitalität\"><figcaption>Trank der Vitalität<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/11-Trank-des-Feueratems.png\" alt=\"Trank des Feüratems\"><figcaption>Trank des Feüratems<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/99-Trank-der-Schnelligkeit.png\" alt=\"Trank der Schnelligkeit\"><figcaption>Trank der Schnelligkeit<\/figcaption><\/figure>\n<\/div>\n\n## Feuerpfeile\n\n<div class=\"karten-grid\">\n<figure><img src=\"Trankkarten/12-Feuerpfeile.png\" alt=\"Feürpfeile\"><figcaption>Feürpfeile<\/figcaption><\/figure>\n<\/div>\n\n## Toms Giftschrank\n\n<div class=\"karten-grid\">\n<figure><img src=\"Trankkarten/Gifte/G00-Toms-Giftschrank.png\" alt=\"Toms Giftschrank\"><figcaption>Toms Giftschrank<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G01-Wyverngift.png\" alt=\"Wyverngift\"><figcaption>Wyverngift<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G02-Schlangengift.png\" alt=\"Schlangengift\"><figcaption>Schlangengift<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G03-Drowgift.png\" alt=\"Drowgift\"><figcaption>Drowgift<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G04-Purpurwurmgift.png\" alt=\"Purpurwurmgift\"><figcaption>Purpurwurmgift<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G05-Assassinenblut.png\" alt=\"Assassinenblut\"><figcaption>Assassinenblut<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G06-Mitternachtstraenen.png\" alt=\"Mitternachtstränen\"><figcaption>Mitternachtstränen<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G07-Bleiche-Tinktur.png\" alt=\"Bleiche Tinktur\"><figcaption>Bleiche Tinktur<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G08-Betaeubung.png\" alt=\"Betäubung\"><figcaption>Betäubung<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G09-Wahrheitsserum.png\" alt=\"Wahrheitsserum\"><figcaption>Wahrheitsserum<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G10-Kriechergeifer.png\" alt=\"Kriechergeifer\"><figcaption>Kriechergeifer<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G11-Taggitoel.png\" alt=\"Taggitöl\"><figcaption>Taggitöl<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G12-Verbrannte-Othurdaempfe.png\" alt=\"Verbrannte Othurdämpfe\"><figcaption>Verbrannte Othurdämpfe<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G13-Aetheressenz.png\" alt=\"Ätheressenz\"><figcaption>Ätheressenz<\/figcaption><\/figure>\n<figure><img src=\"Trankkarten/Gifte/G14-Bosheit.png\" alt=\"Bosheit\"><figcaption>Bosheit<\/figcaption><\/figure>\n<\/div>\n"}}};
const order = [];
function buildTree(items, ul, depth){
  for(const it of items){
    const li = document.createElement('li');
    if(it.type==='page'){
      const a = document.createElement('a'); a.href='#'+it.id; a.textContent=it.title; a.dataset.id=it.id; li.appendChild(a); order.push(it.id);
    } else {
      li.className = depth===0 ? 'open' : '';
      const b = document.createElement('button'); b.type='button'; b.className='grp'; b.textContent=it.title;
      b.onclick=()=>li.classList.toggle('open'); li.appendChild(b);
      const sub = document.createElement('ul'); buildTree(it.children, sub, depth+1); li.appendChild(sub);
    }
    ul.appendChild(li);
  }
}
buildTree(DATA.tree, document.getElementById('tree'), 0);
marked.setOptions({gfm:true, breaks:false});
function show(id){
  const p = DATA.pages[id] || DATA.pages['readme']; if(!DATA.pages[id]) id='readme';
  const art = document.getElementById('art');
  let html = marked.parse(p.md);
  html = html.replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
  const i = order.indexOf(id);
  let pager = '<div class="pager">';
  pager += i>0 ? `<a href="#${order[i-1]}">← ${DATA.pages[order[i-1]].title}</a>` : '<span></span>';
  pager += i<order.length-1 ? `<a href="#${order[i+1]}">${DATA.pages[order[i+1]].title} →</a>` : '';
  pager += '</div>';
  art.innerHTML = `<div class="crumb">${p.path}</div>` + html + pager;
  document.querySelectorAll('nav a').forEach(a=>{ a.classList.toggle('on', a.dataset.id===id);
    if(a.dataset.id===id){ let el=a.parentElement; while(el && el.id!=='tree'){ if(el.tagName==='LI') el.classList.add('open'); el=el.parentElement; } } });
  const main=document.getElementById('main'); main.scrollTop=0; window.scrollTo(0,0);
  if(window.innerWidth<=760) document.getElementById('nav').hidden=true;
  try{ localStorage.setItem('grosstat-page', id); }catch(e){}
}
function route(){ const h=location.hash.replace('#',''); let id=h; if(!id){ try{ id=localStorage.getItem('grosstat-page')||''; }catch(e){} } show(id||'readme'); }
window.addEventListener('hashchange', route);
document.getElementById('navtoggle').onclick=()=>{ const n=document.getElementById('nav'); n.hidden=!n.hidden; };
if(window.innerWidth<=760) document.getElementById('nav').hidden=true;
route();
</script>

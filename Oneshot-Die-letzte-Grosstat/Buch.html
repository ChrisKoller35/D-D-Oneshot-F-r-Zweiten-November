<title>Die letzte Großtat</title>
<!-- Offline-Fassung des Kampagnenbuchs: liegt im Ordner Oneshot-Die-letzte-Grosstat, Karten relativ aus Karten/. Erzeugt von build.py; nach jeder Textaenderung neu bauen. -->
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fixed chapter tree on the left like a book's table of contents, reading column on the right; phone stacks with a toggle. */
:root{
  --bg:#e9ebee; --paper:#f6f6f3; --ink:#1e2430; --muted:#5d6675; --line:#cfd4dc;
  --accent:#2f5775; --gold:#9a7a2c; --quote:#eef1f4; --hover:#dfe4ea; --active:#d6e0ea;
  --display:"Cinzel",Georgia,serif; --body:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171a20; --paper:#1f242c; --ink:#e4e6ea; --muted:#9aa3b0; --line:#343b47;
  --accent:#8fb6d6; --gold:#d2b15c; --quote:#262c36; --hover:#262c36; --active:#2c3744; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#171a20; --paper:#1f242c; --ink:#e4e6ea; --muted:#9aa3b0; --line:#343b47;
  --accent:#8fb6d6; --gold:#d2b15c; --quote:#262c36; --hover:#262c36; --active:#2c3744; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.app{display:flex;height:100%;min-height:0}
nav{width:300px;flex:none;background:var(--bg);border-right:1px solid var(--line);overflow-y:auto;
  padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;color:var(--ink);margin:0 0 2px 8px}
.sub{font-size:.8rem;color:var(--muted);margin:0 0 16px 8px}
nav ul{list-style:none;margin:0;padding:0}
nav li{margin:0}
nav a,nav button.grp{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--ink);
  font:inherit;font-size:.95rem;padding:5px 8px;border-radius:5px;text-decoration:none;line-height:1.3}
nav a:hover,nav button.grp:hover{background:var(--hover)}
nav a.on{background:var(--active);color:var(--accent);font-weight:600}
nav button.grp{font-family:var(--display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
nav button.grp::before{content:"▸";display:inline-block;width:1.1em;transition:transform .15s}
nav li.open>button.grp::before{transform:rotate(90deg)}
nav li>ul{display:none;padding-left:14px}
nav li.open>ul{display:block}
nav ul ul button.grp{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.93rem;color:var(--ink);margin-top:2px}
main{flex:1;min-width:0;overflow-y:auto;background:var(--paper);
  padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
article{max-width:46rem;margin:0 auto}
.crumb{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-bottom:14px;word-break:break-all}
article h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.2;margin:0 0 .7em;color:var(--ink);text-wrap:balance;
  border-bottom:2px solid var(--gold);padding-bottom:.35em}
article h2{font-family:var(--display);font-weight:500;font-size:1.2rem;margin:1.8em 0 .5em;color:var(--accent);text-wrap:balance}
article h3{font-size:1.05rem;font-weight:600;margin:1.4em 0 .4em}
article p{margin:0 0 .9em}
article blockquote{margin:1em 0;padding:.7em 1em;background:var(--quote);border-left:3px solid var(--gold);font-style:italic}
article blockquote p:last-child{margin:0}
article a{color:var(--accent)}
article code{font-family:var(--mono);font-size:.85em;background:var(--quote);padding:.1em .3em;border-radius:3px}
article pre{background:var(--quote);padding:.8em 1em;overflow-x:auto;border-radius:5px;font-size:.82rem;line-height:1.35}
article pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:1em 0}
article table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
article th,article td{border:1px solid var(--line);padding:.4em .6em;text-align:left;vertical-align:top}
article th{background:var(--quote);font-weight:600}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
article ul,article ol{padding-left:1.4em;margin:0 0 .9em}
article li{margin:.2em 0}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:3em;padding-top:1em;border-top:1px solid var(--line);font-size:.9rem}
.pager a{color:var(--accent);text-decoration:none}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;gap:12px}
.topbar button{font:inherit;font-size:.9rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer}
.topbar span{font-family:var(--display);font-size:.9rem}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .app{flex-direction:column}
  .topbar{display:flex}
  nav{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:60vh;padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav[hidden]{display:none}
  main{overflow:visible}
  body{height:auto} html{height:auto}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
img.map{display:block;max-width:100%;height:auto;background:#fff;border:1px solid #d8d0c0;border-radius:6px;margin:12px 0 20px;}
/* Monsterkarten und Trankkarten: Bilder im Raster, Bogen = 2 Spalten, Karte = 4 Spalten */
.bogen-grid,.karten-grid{display:grid;gap:14px;margin:12px 0 24px;}
.bogen-grid{grid-template-columns:repeat(2,1fr);} .karten-grid{grid-template-columns:repeat(4,1fr);}
.bogen-grid figure,.karten-grid figure{margin:0;} .bogen-grid img,.karten-grid img{display:block;width:100%;height:auto;border:1px solid #d8d0c0;border-radius:6px;background:#fff;}
.bogen-grid figcaption,.karten-grid figcaption{font-size:.85em;text-align:center;margin-top:4px;opacity:.8;}
@media (max-width:760px){ .bogen-grid{grid-template-columns:1fr;} .karten-grid{grid-template-columns:repeat(2,1fr);} }
</style>

", "path": "Orte/Drachenhort.md"}, {"type": "page", "id": "orte-felsenpass", "title": "Felsenpass", "path": "Orte/Felsenpass.md"}, {"type": "page", "id": "orte-hordenlager", "title": "Hordenlager", "path": "Orte/Hordenlager.md"}, {"type": "page", "id": "orte-sturmgebiet", "title": "Sturmgebiet", "path": "Orte/Sturmgebiet.md"}]}, {"type": "group", "title": "Karten", "path": "Karten/", "children": [{"type": "page", "id": "karten-karten", "title": "Karten", "path": "Karten/Karten.md"}, {"type": "page", "id": "karten-drachenhort", "title": "Drachenhort", "path": "Karten/Drachenhort.md"}]}, {"type": "group", "title": "Regeln", "path": "Regeln/", "children": [{"type": "page", "id": "regeln-geschuetze", "title": "Geschütze", "path": "Regeln/Geschuetze.md"}]}, {"type": "group", "title": "Quests", "path": "Quests/", "children": [{"type": "page", "id": "quests-hauptquest-die-letzte-grosstat", "title": "Hauptquest Die letzte Großtat", "path": "Quests/Hauptquest-Die-letzte-Grosstat.md"}]}, {"type": "group", "title": "Belohnungen", "path": "Belohnungen/", "children": [{"type": "page", "id": "belohnungen-uebersicht", "title": "Übersicht", "path": "Belohnungen/Uebersicht.md"}]}, {"type": "page", "id": "monsterboegen-monsterkarten", "title": "Monsterkarten", "path": "Monsterboegen/Monsterkarten.md"}, {"type": "page", "id": "trankkarten-trankkarten", "title": "Trankkarten", "path": "Trankkarten/Trankkarten.md"}], "pages": {"readme": {"title": "Überblick", "path": "README.md", "md": "# Oneshot: Die letzte Großtat\n\nEin eigenständiger Oneshot: eine Schlacht um ein Land, in einem\nAbend oder zwei. Keine Verbindung zu anderen Kampagnen – die Helden\nkönnen danach überallhin.\n\n> Hinweis: Ordner- und Dateinamen verwenden `ae/oe/ue` statt Umlauten\n> In den Texten stehen normale\n> Umlaute.\n\n**Rahmen:** 3 Helden, Stufe 8, mit starker Ausrüstung (je ein\nseltener und zwei ungewöhnliche magische Gegenstände), plus der\nNPC-Gefährte **Milo Klee** (Bauer, Koch und Heiler mit wenigen Zaubern, Stufe 8) (→ [Beschreibung](#npc-milo-klee-beschreibung)). Spielzeit: ein langer Abend\n(5–6 Stunden) oder zwei normale Abende. Kürzungs-Tipps stehen in\n[Story Gesamt](#story-story-gesamt), Abschnitt „Spielzeit\".\n\n**Alle Gegner stammen aus dem Monsterhandbuch (2024) und aus Monsters\nof the Multiverse.** Nichts ist erfunden – nur Namen und die\nBegegnungen drumherum. Der **Anführer der Horde** ist **Kazzamir, der\nGehörnte**, ein Gehörnter Teufel (HG 11).\n\n## Die Story in einem Satz\n\nNach Monaten Krieg wendet sich das Blatt in Nordgar, einem Land\nim hohen Norden: Die Horde, die sich bis vor die Hauptstadt gebrannt\nhatte, ist bis an den Felsenpass zurückgedrängt, und\ndie Helden werden zur Speerspitze des Gegenangriffs: Sie nehmen die\nGeschütztürme im Felsenpass, schießen die Drachen der Horde vom\nHimmel, entscheiden die Feldschlacht, rasten im verlassenen\nHordenlager hinter der Verengung und brechen am nächsten Tag in die Burg Veldgard\nein, wo der Anführer der Horde, ein Gehörnter Teufel, in der großen Halle auf sie wartet.\n\n→ Vollständige Story: [Story/Story-Gesamt.md](#story-story-gesamt)\n\n## Ordnerstruktur\n\n- **Buch.html** – Das ganze Kampagnenbuch als eine Seite zum Anklicken, läuft\n  ohne Internet direkt aus diesem Ordner (Karten aus [Karten](#karten-karten)). Wird bei\n  jeder Textänderung neu erzeugt; die Markdown-Dateien bleiben die Quelle.\n- **Story/** – Die Geschichte\n  - `Story-Gesamt.md` – Die komplette Story in Reihenfolge mit Verweisen\n  - Erzähler-Kapitel und Spieler-Handouts sind seit 1.11.2026 aus dem Buch genommen (liegen in `_to_delete/`); Toms Tränke-Karte steht bei Druide Tom\n- **NPC/** – Verbündete, pro NPC ein Ordner mit **Stats/** und **Faehigkeiten/**\n  - Milo Klee (der NPC-Gefährte), Druide Tom, Schmied Orvin, Marschallin\n    Hedda, Rittmeisterin Lenja (Greifen), Sturmmagier Elion (der Bote),\n    Silberdrachin Argentys, Soldaten und Trupp Eisenwacht\n    (Hauptmann Corvin Rask, Meuchler, Soldaten für die Feiern)\n- **Feinde/** – seit 1.11.2026 nur noch **eine Seite**: [Kampfübersicht](#feinde-uebersicht),\n  die Kampfübersicht (Kampf für Kampf: welche Monster, wie viele, HG, RK, TP,\n  dazu die Kurzregel, wie das Ziel fällt). Werte gelten nach den\n  Statblock-Bildern in `Monster-Screenshots/`; gedruckte Bögen in [Monsterkarten](#monsterboegen-monsterkarten).\n  Die alten Einzelseiten (Horde, Kazzamir, große Ziele, Drachen, Nadel,\n  Drachenhort-Bestien) liegen in `_to_delete/Feinde-alt-2026-11-01/`\n- **Orte/** – Burg Rabenwacht, Felsenpass, Sturmgebiet, Hordenlager, Burg Veldgard, Der Fluchtgang (1b), Der Drachenhort (1c)\n- **Karten/** – Skizzen (Burg Rabenwacht, Schlachtfeld, Region) als SVG und Karten.html\n- **Regeln/** – Geschütze und Drachenjagd (eine Seite)\n- **Quests/** – Hauptquest\n- **Belohnungen/** – Tränke, Schliffe, Belohnungen nach dem Sieg\n- **Trankkarten/** – Druckbare Karten zu Toms Tränken und Giften (PNG je Karte, Druckbögen A4; Gifte im Unterordner Gifte/)\n- **Sessions/** – Protokoll des Spielabends\n\n## Ablauf\n\n1. **Kriegsrat und Siegesfeier** (Rabenwacht: Aufräumen, Heddas Verhör, Gespräch im Hof, Besprechungsbüro, Feier)\n   - optional **1b: Der Tunnel des Spions** (Verfolgung, Hinterhalt, Tränke zurück)\n   - optional **1c: Die gekettete Drachin** (Argentys in Ketten, Dungeon Drachenhort, Schwert Silberzahn; überspringt Kapitel 2–4)\n2. **Der Weg zu den Türmen** (Greifen, dann leise oder dreist)\n3. **Die Geschütztürme** (Ballisten, Drachenjagd)\n4. **Die Schlacht auf der Ebene** (Feuerbälle, drei große Ziele)\n5. **Das Hordenlager** (Verengung, Rast, Siegestrunk)\n6. **Sturm auf Veldgard** (die große Halle, Kazzamir der Gehörnte)\n7. **Nach der Schlacht** (Preis, Totenfeuer, Milos Abschied)\n\n## Geografie\n\nNordgar liegt im hohen Norden. Seine Hauptstadt **Dunmar**\nliegt ganz im Süden des Landes; bis vor ihre Tore kam die Horde, bevor\nsie zurückgedrängt wurde. Was südlich von Nordgar liegt, bleibt\noffen – die Stadt für Milos Laden hat noch keinen Namen.\n\n**Der Felsenpass** (Karten → [Karten](#karten-karten)): Burg Rabenwacht steht\nim offenen Land, ein Stück vor den Bergen, nicht am Eingang des Passes.\nDer Pass beginnt mit der breiten Ebene (Kapitel 4), verengt sich an\neinem Felsvorsprung (Verengung), dahinter liegt links der Kessel mit dem\nHordenlager (Kapitel 5), und rechts läuft die Schlucht offen aus – kein\nTor, keine Schleuse. Am offenen Ende, wo das Land wieder grün wird\n(Wiesen, Flussauen), steht Burg Veldgard (Kapitel 6).\n\n## Noch offen / zum Anpassen\n\n- Die Türme heißen schlicht «Turm 1 rechts» (unten) und «Turm 2 rechts» (oben); die linken nimmt die Eisenwacht unter Hauptmann Corvin Rask. Die Namen der Burgen und NPCs sind Vorschläge.\n"}, "story-story-gesamt": {"title": "Story Gesamt", "path": "Story/Story-Gesamt.md", "md": "# Story-Gesamt: Die letzte Großtat\n\nDie komplette Geschichte in Reihenfolge. Zu jedem Abschnitt steht,\n**welcher Block in welchem Ordner liegt**. Details und die 3–4\nSzenarien pro Abschnitt stehen in den Kapiteln unter `Story/Erzaehler/`.\n\n**Alle Gegner stammen aus dem Monsterhandbuch (2024) und aus Monsters\nof the Multiverse** (Höllenfeuer-Maschine, Feuerriese, Kriegspriester, Fäulnistroll, junge rote Drachen,\nGreif, uralte Silberdrachin, Goblins, Hobgoblins, Orks, Worgs,\nBugbear-Pirscher, Hobgoblin-Verwüster, Gehörnter Teufel). Nichts ist\nerfunden – nur die Namen und die Begegnungen drumherum. **Der\nAnführer der Horde ist Kazzamir, der Gehörnte** – ein Gehörnter\nTeufel, HG 11 (→ [Kampfübersicht](#feinde-uebersicht)).\n\n---\n\n## Ausgangslage\n\n**Nordgar** ist ein Land im hohen Norden – weite Felder, Weiden und\nFlüsse, dazwischen Burgen und Garnisonsstädte. Ganz im Süden liegt\ndie Hauptstadt **Dunmar**; ganz im Osten, hinter dem Felsenpass, die Grenzburg\n**Veldgard** im grünen Veldaren. Seit dem Frühjahr steht die\nNordgar im Krieg: Aus dem Osten kam eine **Armee** – Goblins,\nHobgoblins und Orks unter **Kazzamir, dem Gehörnten**, einem Teufel,\nden ihr Hochpriester gerufen hat und der klüger ist als sie alle.\nAls Erstes fiel Veldgard. Von dort aus schlug die Horde ihr Lager\nhinter der Verengung auf, kam durch den Felsenpass und brannte sich den\nganzen Sommer lang durch Nordgar – Dorf um Dorf, Burg um Burg, bis vor\ndie Tore von Dunmar.\n\nDort, kurz vor der Hauptstadt, hielt das Heer Nordgars zum ersten\nMal stand. Seitdem drängt es die Horde zurück – monatelang, mit\nwechselndem Glück, den ganzen Weg nach Osten; seit einigen Wochen\nhäufen sich die Erfolge.\n\nNordgar stand nicht allein. Im Sommer schickten die Nachbarn, was sie\nentbehren konnten: aus **Sildoras** im Süden kamen die **Sonnenlanzen**,\ndreihundert Reiter in roten Mänteln; aus der Zwergenfeste **Dhurgan** im\nWestgebirge die **Hammergarde** mit ihren schweren Armbrüsten; von den\nGoliath-Clans des Hochlands **Skarn** ein Dutzend Träger, die Leitern und\nVerwundete schleppen, als wögen sie nichts; zuletzt, als die Horde schon\nzurückwich, die **Grünpfeile** aus dem Waldreich **Thalvien**. Zusammen\nsind sie ein Viertel des Heeres, und alle gehorchen Marschallin Hedda.\n\n**Heute** war die größte und schwerste\nSchlacht des Krieges: die Schlacht auf der Ebene vor **Burg Rabenwacht**,\nder letzten Burg vor dem Pass, begonnen beim\nersten Sonnenstrahl und früh gewonnen – mit den Helden in vorderster\nReihe (das wird erzählt, nicht gespielt). Viel wurde gewonnen; die Burg\nselbst ist fast unversehrt, und seit dem Morgen richtet sich das Heer\ndarin und rundherum ein. Morgen fällt die Entscheidung. Die Helden und ihr Gefährte\n**Milo Klee** (→ [Beschreibung](#npc-milo-klee-beschreibung)) sind die besten\nKlingen, die das Heer hat – und der beste Kessel.\n\n## Akt 1: Kriegsrat und Siegesfeier (Burg Rabenwacht)\n\n**Nachmittag:** Die Schlacht wurde draußen auf dem Feld geschlagen; die\nBurg selbst ist größtenteils intakt, die Goblins haben sie kaum genutzt.\nFreigeräumt wurde nur, wo das Heer Platz brauchte – für die langen\nReihen Zelte rund um die Burg und im Innenhof; der Rest des Tages ist\nEinrichten, und die Helden helfen seit dem Morgen mit. Schreie aus einem\nRaum am Hof: **Marschallin Hedda Eisenbrecht** verhört die gefangenen\nOrks. Sie kommt blutig heraus, sieht die Helden und redet erst einmal\nmit ihnen (kurzer Dialog). Dann schlägt sie vor, in ihr\n**improvisiertes Besprechungsbüro** zu gehen.\n**Vor dem Essen:** Besprechung im Büro. Die Horde steht auf der Ebene im\nFelsenpass und will die Schlacht dort wenden; sie hat **Drachen** und\nhat die **Geschütztürme** in den Felswänden besetzt. Die Helden sollen\nmorgen die **rechten Türme** nehmen (die linken übernimmt der Trupp\nEisenwacht unter Hauptmann Corvin Rask) und damit die Drachen vom Himmel holen. Fragt jemand, ob\nman die **Silberdrachin** im Sturmgebiet überzeugen könnte, schlägt\nHedda den **Sturmmagier Elion** als Boten vor.\nVerlangen die Helden schon hier nach **Druide Tom** oder **Schmied\nOrvin**, kommen die beiden noch vor dem Fest ins Büro.\n**Abend:** Siegesfeier für Rabenwacht. Milos Eintopf, Tom (zwei Tränke\npro Held) und Orvin (Waffe +1 für alle, Glutschild, eine Rüstung +1, über Nacht), falls noch\nnicht geschehen, die Skizze der Greifenreiter – und, nur wenn die Helden die\nBurg absuchen, ein **Spion** (ein Bugbear, der durch einen vergessenen\nFluchtgang in den Keller kommt), der Tom bestehlen will. Lange Rast.\n\n- Erzähler-Kapitel: `Story/Erzaehler/01-Siegesfeier-und-Kriegsrat.md`\n- Ort: [Burg Rabenwacht](#orte-burg-rabenwacht)\n- NPC: [Beschreibung](#npc-marschallin-hedda-beschreibung), [Beschreibung](#npc-druide-tom-beschreibung), [Beschreibung](#npc-schmied-orvin-beschreibung), [Beschreibung](#npc-sturmmagier-elion-beschreibung)\n- Handouts: `Story/Spieler/Handout-Marschbefehl.md`, `Story/Spieler/Handout-Karte-Felsenpass.md`, `Story/Spieler/Handout-Toms-Traenke.md`, `Story/Spieler/Handout-Milos-Kochbuch.md`\n\n### Optionale Zwischenspiele nach Akt 1\n\nZwei Kapitel, die nur spielen, wenn die Spieler sie auslösen:\n\n- **Kapitel 1b: Der Tunnel des Spions** – Entkommt Pitt mit Toms\n  Phiolentasche, flieht er durch einen alten Fluchtgang unter dem\n  Keller. Verfolgung mit drei Würfen, Hinterhalt der Meuchlerin\n  **Nadel** (Assassine) mit zwei Bugbear-Pirschern und Pitt selbst\n  (Bugbear-Krieger), Tränke zurück. Der Gang\n  endet bei den Hügeln vor der Ebene; dort ist nichts, er kann\n  verschlossen werden. Kein Gewinn – mit Absicht.\n  → `Story/Erzaehler/01b-Der-Tunnel-des-Spions.md`, [Der Fluchtgang](#orte-der-fluchtgang)\n- **Kapitel 1c: Die gekettete Drachin** – Fliegen die Helden selbst\n  ins Sturmgebiet, finden sie Argentys in Kaltstahlketten an einem\n  Siegelstein, mit dem ein Lich aus dem Norden sie hereingelegt hat (die\n  Horde hat den Stein nur getragen). Ihr Schwert **Silberzahn** liegt in den\n  **Drachenhort** unter der Silberkanzel (Ebene 1: Mantikore und\n  Winterwölfe, dann ein Chimären-Paar; Ebene 2: Gifttroll mit zwei\n  Trollen; Bossraum: Schreckenstroll – nur Bestien des Sturmgebiets).\n  Damit brechen sie die Ketten; Argentys fliegt zur Schlacht und\n  vernichtet Drachen, Türme und Horde. **Akt 2 bis 4 entfallen**, die\n  Gruppe springt zu Akt 5 (Rast) und greift am nächsten Tag Veldgard\n  an. Schickt die Gruppe Elion, bleibt alles wie gehabt.\n  → `Story/Erzaehler/01c-Die-gekettete-Drachin.md`, [Drachenhort](#orte-drachenhort)\n\n## Akt 2: Der Weg zu den Türmen\n\nDie **Greifen** fliegen die Helden so nah wie möglich an die rechte\nFelswand. Von dort eine **Rampe** aufs Felsband mit den beiden\nGeschützstellungen, zwei Arten, sie zu nehmen: **leise** (Nebelsteig,\nWachposten, im Rauch die Rampe hinauf) oder **dreist** (als Hordentrupp\nverkleidet, ein Held als Hauptmann, Milo als Gefangener, Losung an der Barrikade). Kein Klettern. Parallel\nmarschiert das Heer auf die Ebene.\n\n- Erzähler-Kapitel: `Story/Erzaehler/02-Der-Weg-zu-den-Tuermen.md`\n- Ort: [Felsenpass](#orte-felsenpass)\n- NPC: [Beschreibung](#npc-rittmeisterin-lenja-beschreibung)\n\n## Akt 3: Die Geschütztürme\n\nZwei Geschützstellungen – offene Ballisten-Plattformen, keine Gebäude –\nnebeneinander auf dem Felsband der rechten Wand, 7 m (22 Fuß)\nZwischenraum: die **Rampe** mit zwei Barrikaden, **Turm 1 rechts** (eine\nBallista), der **Zwischenraum** und **Turm 2 rechts** (zwei Ballisten).\nWer wo steht, steht nur in Kapitel 3 (Besatzungstabelle). Die Helden\nerobern sie – **danach** drehen sie die **Ballisten** und schießen die\n**roten Drachen** (drei junge rote Drachen) ab, die erst jetzt aus dem\nHordenlager im Kessel aufsteigen und das Heer mit Feuer bewerfen – die\nSzene **Drachenjagd** mit vereinfachten Regeln (→ [Geschütze](#regeln-geschuetze)).\n\n- Erzähler-Kapitel: `Story/Erzaehler/03-Die-Geschuetztuerme.md`\n- Regeln: [Geschütze](#regeln-geschuetze)\n- Feinde: [Kampfübersicht](#feinde-uebersicht), [Kampfübersicht](#feinde-uebersicht)\n\n## Akt 4: Die Schlacht auf der Ebene\n\nDie Greifen rücken auf und holen die Helden ab. Entscheidung: zurück\nzur Burg oder mitkämpfen? Wer kämpft, landet, wo er will – die Horde\nkann ihn nicht halten. Ist die **Silberdrachin Argentys**\nfreigeschaltet, wird der Flug zur Szene: Feuerbälle steigen auf, und\nwer fällt, wird von ihr aufgefangen. Auf der Ebene warten die\n**drei großen Ziele**: die **Hellfire Engine** (die Höllenfeuer-Maschine mit dem\nKessel auf dem Rücken), der **Feuerriese** (die Horde nennt ihn den Riesenork) und der\n**Fäulnistroll**, der das Kettenbanner im Rücken trägt, mit dem\n**Kriegspriester** im Korb auf seinem Rücken. Alle drei\nmüssen fallen – erst dann bricht die Horde – und staut sich auf der Flucht in der\nVerengung am Felsvorsprung, wo das Heer sie einholt.\n\n- Erzähler-Kapitel: `Story/Erzaehler/04-Die-Schlacht-auf-der-Ebene.md`\n- Feinde: [Kampfübersicht](#feinde-uebersicht), [Kampfübersicht](#feinde-uebersicht), [Kampfübersicht](#feinde-uebersicht)\n- NPC: [Beschreibung](#npc-silberdrachin-argentys-beschreibung)\n\n## Akt 5: Das Hordenlager\n\nHinter der Ebene verengt sich der Pass am Felsvorsprung. Dahinter\nliegt im **Kessel** das Lager der Horde, und rechts davon läuft die\nSchlucht offen aus – kein Tor, keine Schleuse. Die Horde kann die\nVerengung nicht halten; sie rennt am eigenen Lager vorbei und den\noffenen Pass hinunter. Die Helden nehmen Enge und Lager **kampflos** ein\nund errichten im Kessel ihr eigenes Lager. **Lange Rast**, ein\nSiegestrunk, Heddas Plan für morgen, Argentys' drei Fragen.\n\n- Erzähler-Kapitel: `Story/Erzaehler/05-Das-Hordenlager.md`\n- Ort: [Hordenlager](#orte-hordenlager)\n\n## Akt 6: Sturm auf Burg Veldgard\n\nDie Reste der Horde stürmen aus Veldgard, das Heer stellt sich\nihnen. Die Helden reiten\nauf den Greifen **direkt in die Festung**, dringen ein und stellen\n**Kazzamir, den Gehörnten**, in der großen Halle – allein gegen allein.\nEs kommt keine Hilfe: Hedda, das Heer und Argentys vernichten\ndraußen den Rest der Horde.\n\n- Erzähler-Kapitel: `Story/Erzaehler/06-Sturm-auf-Veldgard.md`\n- Ort: [Burg Veldgard](#orte-burg-veldgard)\n- Endgegner: [Kampfübersicht](#feinde-uebersicht) (Gehörnter Teufel, HG 11 – Stats, Faehigkeiten, Ultimative-Faehigkeiten)\n\n## Akt 7: Nach der Schlacht\n\nSieg. Der Preis, das Totenfeuer, die Abschiedsfeier\nauf Rabenwacht, Milos Abschiedsessen und sein Laden. Ende – mit\ndrei losen Fäden für später, falls gewünscht.\n\n- Erzähler-Kapitel: `Story/Erzaehler/07-Nach-der-Schlacht.md`\n- Belohnungen: [Übersicht](#belohnungen-uebersicht)\n- Handout: `Story/Spieler/Handout-Milos-Kochbuch.md`\n\n---\n\n## Spielzeit\n\nRichtwerte: Akt 1 ≈ 60 Min · Akt 2 ≈ 30 Min · Akt 3 ≈ 60 Min ·\nAkt 4 ≈ 75 Min · Akt 5 ≈ 40 Min · Akt 6 ≈ 75 Min · Akt 7 ≈ 20 Min.\nZusammen 5–6 Stunden.\n\n**Kürzen auf einen Abend (≈ 4 Std.):** Akt 2 als Erzählung mit zwei\nWürfen abhandeln, Akt 5 auf Einnahme und Lagerfeuer\nkürzen, in Akt 4 nur zwei der drei großen Ziele von den Helden\nerledigen lassen (das dritte fällt dem Heer).\n\n**Auf zwei Abende teilen:** Schnitt nach Akt 4 (die Horde bricht, die\nHelden sehen die Verengung, Schwarzblende). Abend 2 beginnt mit dem\nMarsch zum Hordenlager.\n\n**Wichtig:** In D&D läuft nie etwas nach Plan. Jedes Erzähler-Kapitel\nenthält deshalb **3–4 Szenarien**, was passieren könnte, und wie du\ndarauf reagierst.\n"}, "npc-die-verbuendeten-beschreibung": {"title": "Beschreibung", "path": "NPC/Die-Verbuendeten/Beschreibung.md", "md": "# Die Verbündeten\n\nVier Länder haben Nordgar Soldaten geschickt (→ Ausgangslage in\n[Story Gesamt](#story-story-gesamt)). Zusammen sind sie ein Viertel des Heeres,\nund alle gehorchen Marschallin Hedda. Ihre vier Hauptleute sind\nNebenfiguren wie Corvin Rask: **kein fester Auftritt**, sie sind da,\nwenn ein Spieler sie anspricht – im Kriegsrat (Kapitel 1, Szene 1\nerwähnt Hedda sie), an der Siegesfeier (Kapitel 1, Szene 2), beim\nTotenfeuer (Kapitel 7). Werte haben sie trotzdem (→\n[Stats](#npc-die-verbuendeten-stats-stats)): für den Fall, dass sie in der Schlacht (Kapitel 4)\nvorne stehen und die Höllenfeuer-Maschine aufhalten, bis die Helden\nkommen.\n\n## Sildoras – das Weinland im Süden\n\nEin warmes Fürstentum jenseits der Südberge: Weinberge an den Hängen,\nbreite Flussauen, weiße Städte am Wasser. Sildoras hat seit hundert\nJahren keinen Krieg geführt, aber es steht in Nordgars Schuld: In\nschlechten Jahren hat Nordgars Getreide die Städte von Sildoras satt\ngemacht, und das hat man dort nicht vergessen. Der Fürst schickte, was\nSildoras am besten kann: Reiterei. Die **Sonnenlanzen** sind dreihundert\nLanzenreiter in roten Mänteln auf hohen Pferden, und sie haben den Wein\nfür die Siegesfeier mitgebracht.\n\n**Ritter Aurel Vanthis**, Hauptmann der Sonnenlanzen. Mensch, Ende\nzwanzig, zu schön für diesen Krieg: polierter Harnisch, gepflegter\nBart, der jüngste Sohn eines Weingutes. Es ist sein erster Krieg, und\ner will mit einer Geschichte nach Hause reiten. Er ist mutig, aber\nungeduldig.\n\n## Dhurgan – die Zwergenfeste im Westgebirge\n\nEine Festung im Berg, Hallen, Schmieden und Stollen, am Rand der langen\nBergkette westlich von Nordgar. Dhurgan und Nordgar sind alte Nachbarn:\nZwergische Baumeister haben vor Generationen die Ballisten im Felsenpass\nmitgebaut, und im Winter der langen Eiszeit, als die Stollen verschüttet\nwaren, hat Nordgar die Zwerge durchgefüttert. Dhurgan kam als Erstes,\nohne dass man fragen musste. Die **Hammergarde** sind hundertfünfzig\nZwerge: schwere Armbrüste, Pioniere, Feldscher, Sappeure. Sie bauen in\neiner Nacht eine Brücke und reißen am Morgen eine Barrikade ein. Tilda\nFenn und Brida Steinhand gehören zu ihnen (→\n[Beschreibung](#npc-soldaten-und-trupp-eisenwacht-beschreibung)).\n\n**Brannok Grauhammer**, Hauptmann der Hammergarde. Zwerg, alt, grauer\nZopf im Bart, eine Stimme wie ein Fass, das man über Stein rollt. Hat\ndie Ballisten im Pass als junger Geselle mitgebaut und nimmt es\npersönlich, dass die Horde darauf sitzt. Redet wenig, zählt alles:\nBolzen, Brote, Tote. Hedda vertraut ihm die Verengung an.\n\n## Skarn – das Hochland der Goliaths\n\nKein Land, sondern die Gipfel selbst: Hochtäler über der Baumgrenze, wo\ndie Goliath-Clans im Sommer ihre Herden treiben. Skarn hat keinen König\nund keinen Vertrag. Die Clans kamen, weil die Horde im Frühjahr ihren\nHandelsplatz im Tal niedergebrannt hat und weil ein Goliath eine Tat\nnicht ungezählt lässt. Ein Dutzend sind gekommen, jeder trägt, was zwei\nMänner tragen: Leitern, Verwundete, Ballistenbolzen, einmal einen ganzen\nKarren. In der Schlacht stehen sie, wo etwas gehalten werden muss. Eine\nvon ihnen ist **Skadi**: trägt die Leitern und die Verwundeten, spricht\nnur in ganzen, langsamen Sätzen.\n\n**Thuluk Wolkentreter**, Anführer der Goliaths. Riesig, kahl, Narben\nwie Landkarten auf den Armen; sein Name bedeutet, dass er als Junge\nhöher gestiegen ist als jeder im Clan. Lacht laut, zählt laut, lobt\nlaut. Er führt nicht, er geht voran.\n\n## Thalvien – das Waldreich im Südosten\n\nDichte Wälder und ein breiter Fluss hinter der Bergkette jenseits des\nSturmgebiets, bewohnt von **Halbelfen**. Thalvien ist alt, misstrauisch\nund langsam: Der Rat der Haine zögerte den halben Sommer, ob Nordgars\nKrieg Thalviens Krieg ist. Erst zur Hälfte des Krieges, als das Heer die\nHorde schon zurückdrängte, schickte er die **Grünpfeile**: zweihundert\nLangbogenschützen und Waldläufer in grünen Kapuzen, die über Bergpfade\nkamen, die auf keiner Karte stehen. Sie sind ihre eigene Kompanie im\nHeer, mit eigenen Zelten etwas abseits, eigenen Feuern und eigenem\nEssen; Befehle nimmt nur Sarenne entgegen und gibt sie weiter. Sie reden\nleise und treffen auf dreihundert Schritt. Nordgar hat sie spät kommen\nsehen und sagt es ihnen nicht ins Gesicht; die Grünpfeile wissen es\ntrotzdem.\n\n**Sarenne Ilwyn**, Hauptfrau der Grünpfeile. Halbelfe, sieht aus wie\nMitte dreißig und ist älter, schmal, Haar unter der Kapuze, ein\nLangbogen, der größer ist als sie. Wortkarg, höflich, nie betrunken. Sie\nist hier, weil sie nicht will, dass Nordgar untergeht; mit dem Rat der\nHaine hat das wenig zu tun. Die Zwerge von Dhurgan mag sie trotzdem\nnicht: zu laut, zu nah, und sie fällen Bäume, ohne zu fragen. Brannok und\nsie sprechen nur über Hedda miteinander.\n"}, "npc-die-verbuendeten-stats-stats": {"title": "Stats", "path": "NPC/Die-Verbuendeten/Stats/Stats.md", "md": "# Die Hauptleute der Verbündeten – Statistiken\n\n*Vier kompakte Werteblöcke für den Fall, dass die Hauptleute in der\nSchlacht (Kapitel 4) vorne stehen und die Höllenfeuer-Maschine\naufhalten, bis die Helden kommen. Alle sind so gebaut, dass sie ein\npaar Runden gegen die Maschine durchhalten: viele TP, hohe RK, je eine\nAngriffs- und eine Schutzfähigkeit. Werte im Stil des Monsterhandbuchs\n2024 (Vorbilder: Ritter, Champion, Gladiator, Berserker). Hedda →\n[Stats](#npc-marschallin-hedda-stats-stats).*\n\n## Einsatz in der Schlacht (Erzählerregel)\n\nStehen die Hauptleute (mit oder ohne Hedda) vor der Höllenfeuer-\nMaschine, richtet die Maschine ihre **Höllenwaffe jede Runde auf sie**\nstatt in den Keil des Heeres: Solange mindestens **zwei** von ihnen\nstehen, richtet die Maschine keinen Schaden im Heer an. Zusammen halten sie\ndie Maschine rund **3 bis 4 Runden** auf; danach liegen die ersten am\nBoden. Spiel es grob aus, nicht Wurf für Wurf: Jede Runde trifft eine\nHöllenwaffe einen von ihnen (Schaden laut [Kampfübersicht](#feinde-uebersicht)),\nihre Schutzfähigkeiten fangen den ersten Treffer ab. Wer auf 0 TP\nfällt, ist **bewusstlos, nicht tot** – es sei denn, die Helden kommen\ngar nicht. **Den Kessel greifen die Hauptleute nicht an:** Niemand\nreisst einen Tank voll Hordenfeuer neben dem eigenen Heer auf, und\nohne magische Waffen kratzen sie die Maschine selbst nur an (in 3 bis\n4 Runden etwa 150 ihrer 216 TP, sie steht noch). Die Maschine fällt\nnur durch die Helden. Kommen sie, kämpfen die Hauptleute weiter an\nihrer Seite und halten ihnen Bombardiere und Horde vom Leib.\n\n## Ritter Aurel Vanthis (Sildoras, Sonnenlanzen)\n\n| | |\n|---|---|\n| Typ | Humanoid (Mensch), Mittelgroß |\n| RK | 18 (Plattenrüstung) |\n| TP | 110 |\n| Bewegung | 9 m (beritten 18 m) |\n| STR 18 (+4) | GES 12 (+1) |\n| KON 16 (+3) | INT 11 (+0) |\n| WEI 12 (+1) | CHA 16 (+3) |\n| Rettungswürfe | KON +6, WEI +4 |\n| Fertigkeiten | Athletik +7, Tierkunde +4, Überzeugen +6 |\n| HG | 8 (Übungsbonus +3) |\n\n**Mehrfachangriff:** Zwei Angriffe mit der Sonnenlanze.\n**Sonnenlanze (+1):** Nahkampf +8, Reichweite 3 m, 1W12+5 Stich.\n**Angriff – Sturm der Sonnenlanzen (1× pro Zug):** Reitet Aurel\nmindestens 6 m in gerader Linie auf ein Ziel zu, macht sein erster\nLanzenstoß zusätzlich **3W8 Stich**, und ein großes oder kleineres\nZiel muss einen STR-Rettungswurf DC 16 schaffen oder liegt.\n**Schutz – Sonnenschild (Reaktion, 3× pro Tag):** Wird Aurel von einem\nAngriff getroffen oder scheitert er an einem GES-Rettungswurf, reißt er\nden Schild hoch: Der Schaden wird **halbiert**.\n\n*Kriegspferd:* RK 11, 19 TP, Bewegung 18 m, Hufe +6, 2W6+4 Wucht.\nStirbt das Pferd, kämpft Aurel zu Fuß weiter.\n\n## Brannok Grauhammer (Dhurgan, Hammergarde)\n\n| | |\n|---|---|\n| Typ | Humanoid (Zwerg), Mittelgroß |\n| RK | 18 (Plattenrüstung) |\n| TP | 127 |\n| Bewegung | 7,5 m |\n| STR 18 (+4) | GES 10 (+0) |\n| KON 20 (+5) | INT 14 (+2) |\n| WEI 14 (+2) | CHA 11 (+0) |\n| Rettungswürfe | KON +9, WEI +6 |\n| Fertigkeiten | Athletik +8, Geschichte +6, Wahrnehmung +6 |\n| Resistenzen | Gift |\n| Sinne | Dunkelsicht 36 m |\n| HG | 9 (Übungsbonus +4) |\n\n**Mehrfachangriff:** Zwei Angriffe mit dem Grauhammer.\n**Grauhammer (Schlachthammer):** Nahkampf +8, Reichweite 1,5 m,\n2W6+4 Wucht.\n**Angriff – Wo es knirscht (1× pro Zug):** Brannok kennt jedes Gelenk\nund jede Niete. Trifft er ein **Konstrukt oder ein Objekt** (auch den\nKessel der Maschine), macht der Hammer zusätzlich **3W8 Wucht**.\n**Schutz – Fels im Sturm:** Brannok hat **Resistenz gegen Wucht** und\nkann weder umgeworfen noch gegen seinen Willen verschoben werden,\nsolange er auf dem Boden steht (der Fleischbrecherschritt der Maschine\nwirft ihn nicht um).\n\n## Thuluk Wolkentreter (Skarn, Goliaths)\n\n| | |\n|---|---|\n| Typ | Humanoid (Goliath), Groß |\n| RK | 16 (ohne Rüstung) |\n| TP | 150 |\n| Bewegung | 12 m |\n| STR 22 (+6) | GES 12 (+1) |\n| KON 20 (+5) | INT 9 (−1) |\n| WEI 13 (+1) | CHA 12 (+1) |\n| Rettungswürfe | STR +10, KON +9 |\n| Fertigkeiten | Athletik +10, Einschüchtern +5 |\n| Resistenzen | Kälte |\n| HG | 9 (Übungsbonus +4) |\n\n**Mehrfachangriff:** Zwei Angriffe mit der Riesenaxt.\n**Riesenaxt (für Große gebaut):** Nahkampf +10, Reichweite 3 m,\n2W12+6 Hieb.\n**Angriff – Felswurf (Aktion):** Thuluk hebt einen Felsbrocken oder\nBallistenbolzen und wirft: Fernkampf +10, Reichweite 18/36 m, **3W10+6\nWucht**; ein großes oder kleineres Ziel muss einen STR-Rettungswurf\nDC 17 schaffen oder liegt.\n**Schutz – Steinhaut (Reaktion, 3× pro Tag):** Nimmt Thuluk Schaden,\nspannt er die Muskeln: Der Schaden sinkt um **1W12+5**.\n\n## Hauptfrau Sarenne Ilwyn (Thalvien, Grünpfeile)\n\n| | |\n|---|---|\n| Typ | Humanoid (Halbelfe), Mittelgroß |\n| RK | 17 (beschlagene Lederrüstung) |\n| TP | 104 |\n| Bewegung | 10,5 m |\n| STR 12 (+1) | GES 20 (+5) |\n| KON 14 (+2) | INT 13 (+1) |\n| WEI 16 (+3) | CHA 14 (+2) |\n| Rettungswürfe | GES +9, WEI +7 |\n| Fertigkeiten | Heimlichkeit +13, Wahrnehmung +11, Überlebenskunst +7 |\n| Sinne | Dunkelsicht 18 m |\n| HG | 8 (Übungsbonus +3) |\n\n**Mehrfachangriff:** Drei Angriffe mit dem Langbogen.\n**Langbogen:** Fernkampf +9, Reichweite 45/180 m, 1W8+5 Stich.\n**Angriff – Blattschuss (1× pro Zug):** Trifft ein Pfeil ein Ziel, das\nSarenne nicht sieht kommen (sie hat Vorteil) oder neben dem ein\nVerbündeter von ihr steht, macht er zusätzlich **3W6 Stich**.\n**Schutz – Laub im Wind:** Muss Sarenne einen GES-Rettungswurf gegen\neinen Effekt machen, der bei Erfolg halben Schaden macht, nimmt sie\nbei Erfolg **keinen** Schaden und bei Misserfolg nur die **Hälfte**\n(Knochenschmelzer und Donnerkanone der Maschine treffen sie kaum).\nAußerdem kann sie sich als Bonusaktion verstecken.\n\nBeschreibung → [Beschreibung](#npc-die-verbuendeten-beschreibung)\n"}, "npc-druide-tom-beschreibung": {"title": "Beschreibung", "path": "NPC/Druide-Tom/Beschreibung.md", "md": "# Druide Tom\n\n*(Beschreibung wird neu geschrieben.)*\n\nTränke-Karte → [Handout Toms Tränke](#npc-druide-tom-handout-toms-traenke)\n"}, "npc-druide-tom-handout-toms-traenke": {"title": "Handout Toms Tränke", "path": "NPC/Druide-Tom/Handout-Toms-Traenke.md", "md": "# Handout: Toms Tränke-Karte\n\n*Ein fettiger Zettel, mit Pflanzensaft beschrieben, am Rand\nKritzeleien von Phiolen. Druide Tom hält ihn euch hin: „Zwei pro Nase.\nNicht schütteln. Nie schütteln.\"*\n\n---\n\n**Was im Koffer ist** (jeder Held wählt **zwei**; was nur einmal da\nist, bekommt der Schnellste):\n\n| Nr. | Trank | Seltenheit | Was er tut | Toms Kommentar |\n|---|---|---|---|---|\n| 1 | **Heiltrank** (das Grüne) | gewöhnlich | 2W4+2 TP. Trinken ist eine Bonusaktion. | „Das Grüne ist Heilung. Das andere Grüne nicht.\" |\n| 2 | **Großer Heiltrank** (das dunkle Grüne) | ungewöhnlich | 4W4+4 TP | „Für Notfälle. Jeder Tag ist ein Notfall, ich weiß.\" |\n| 3 | **Vorzüglicher Heiltrank** (fast schwarz) – 2 Stück | selten | 8W4+8 TP | „Schmeckt nach Moos. Wirkt wie ein Priester.\" |\n| 4 | **Trank der Heldenhaftigkeit** (rot, warm) | selten | 1 Stunde: 10 temporäre TP und die Wirkung von *Segen* (+1W4 auf Angriffe und Rettungswürfe), ohne Konzentration | „Macht laut. Sehr laut.\" |\n| 5 | **Trank der Riesenstärke, Feuerriese** (braun, dick) – 1 Stück | selten | 1 Stunde: Stärke 25 | „Ich hatte nur einen Riesenzeh. Fragt nicht, von wem.\" |\n| 6 | **Trank des Fliegens** (himmelblau, leicht) – 2 Stück | sehr selten | 1 Stunde: Flugbewegung gleich der Gehbewegung, Schweben möglich | „Für die, die vom Greifen fallen. Oder für die Türme.\" |\n| 7 | **Trank der Unsichtbarkeit** (klar, der Stöpsel ist nicht zu sehen) – 1 Stück | sehr selten | 1 Stunde unsichtbar; endet, wenn du angreifst oder zauberst | „Für die, die lieber nicht da sind. Milo, Finger weg.\" |\n| 8 | **Trank des Wachstums** (orange) | ungewöhnlich | 1W4 Stunden: wie *Vergrößern* – doppelte Größe, Vorteil auf STR-Proben und -Rettungswürfe, +1W4 Schaden mit Waffen | „Danach passt die Rüstung nicht mehr. Nicht mein Problem.\" |\n| 9 | **Trank der Verkleidung** (violett, schimmert) – Toms eigenes Rezept | selten | 1 Stunde: wie *Selbstverkleidung*, aber **echt**: Du nimmst eine **andere Gestalt** an (Größe, Haut, Stimme, Geruch). Die Gestalt hält Berührung und Blick aus; nur Magie (*Wahrer Blick*) sieht hindurch. Angreifen beendet den Trank nicht. | „Wer du bist, entscheidest du. Eine Stunde lang.\" |\n| 10 | **Trank der Vitalität** (dunkelrot) | sehr selten | Entfernt alle Erschöpfung, heilt jede Krankheit und Vergiftung; 24 Stunden lang bringt jeder Trefferwürfel bei der kurzen Rast das Maximum | „Nach der Schlacht. Oder vor der nächsten. Oder dazwischen.\" |\n| 11 | **Trank des Feueratems** (glühend orange) – 2 Stück | ungewöhnlich | 1 Stunde: Als Bonusaktion Feuer auf eine Kreatur in 9 m (30 Fuß) speien, GES-Rettungswurf DC 13, 4W6 Feuer (halb bei Erfolg). Nach dem dritten Feuerstoß oder nach 1 Stunde ist es vorbei. | „Nicht lachen, nachdem ihr getrunken habt. Nicht niesen. Nicht gähnen.\" |\n| ? | **Trank der Schnelligkeit** (gelbgrün, zischt) – **vielleicht 1 Stück** | sehr selten | 1 Minute wie *Hast* (doppelte Bewegung, +2 RK, Vorteil auf GES-Rettungswürfe, eine zusätzliche Aktion pro Zug), ohne Konzentration, ohne Erschöpfung danach | *(Steht nicht auf der Karte. Wer Tom direkt danach fragt – oder ihm etwas Gutes tut – bekommt ihn vielleicht. Einmal.)* „Den hab ich nicht. Offiziell.\" |\n\n*(Werte nach dem Spielleiterhandbuch 2024, Nummer 9 ist Toms\nHausrezept. Nummer 11 hat Tom extra wegen der Trolle eingepackt: Bei 0 TP\nzählt jeder Feuerstoß des Tranks als Todesstoß, auch bei halbem Schaden. Toms Farben und Namen sind seine eigenen. Alles ohne\nStückzahl ist genug da für alle.)*\n\n---\n\n## Toms Giftschrank (Rückseite des Zettels)\n\n*Kleinere Schrift, sauberer geschrieben. Das hier nimmt Tom ernst.*\n„Gifte zählen nicht als Tränke. Gifte zählen als Gifte. **Eines pro\nNase**, und ihr sagt mir, auf wen.\"\n\n**So geht's:** Ein Gift auftragen ist eine **Aktion** (Bonusaktion mit\ndem Giftmischer-Talent). **Kontakt- und Verletzungsgift** auf eine\nWaffe oder drei Geschosse hält **1 Minute** oder bis zum ersten\nTreffer. **Eingenommen** muss ins Essen oder Trinken (Fingerfertigkeit\ngegen Wahrnehmung). **Eingeatmet** wirkt in einem Würfel von 1,5 m,\nwenn man die Phiole öffnet oder wirft. Alle Werte nach dem\nSpielleiterhandbuch; wo es abweicht, gilt das Buch.\n\n| Gift | Art | Was es tut | Toms Kommentar |\n|---|---|---|---|\n| **Wyverngift** – 2 Stück | Verletzung | KON DC 15, 7W6 Gift (halb bei Erfolg) | „Aus dem Süden. Fragt nicht, was es gekostet hat.\" |\n| **Schlangengift** | Verletzung | KON DC 11, 3W6 Gift (halb) | „Das Anfängergift. Nicht beleidigt sein.\" |\n| **Drowgift** | Verletzung | KON DC 13, sonst 1 Stunde vergiftet; wer um 5 oder mehr scheitert, ist zusätzlich **bewusstlos**, bis er Schaden nimmt oder geweckt wird | „Für die Wache am Nebelsteig. Leise.\" |\n| **Purpurwurmgift** – 1 Stück | Verletzung | KON DC 19, 12W6 Gift (halb) | „Das hier kostet mehr als euer Pferd. Trefft.\" |\n| **Assassinenblut** | Eingenommen | KON DC 10, 1W12 Gift und 24 Stunden vergiftet (halb und nicht vergiftet bei Erfolg) | „Schmeckt nach nichts. Das ist der Punkt.\" |\n| **Mitternachtstränen** | Eingenommen | Wirkt erst um Mitternacht: KON DC 17, 9W6 Gift (halb) | „Wer es trinkt, merkt nichts. Bis Mitternacht.\" |\n| **Bleiche Tinktur** | Eingenommen | KON DC 16, 1W6 Gift und vergiftet; wiederholt sich **jeden Tag**, bis ein Wurf gelingt | „Langsam. Für Leute, die ihr nicht mehr sehen wollt.\" |\n| **Betäubung (Torpor)** | Eingenommen | KON DC 15, sonst 4W6 Stunden **kampfunfähig** | „Wenn ihr jemanden lebend wollt. Der Marschallin gefällt das.\" |\n| **Wahrheitsserum** | Eingenommen | KON DC 11, sonst 1 Stunde wie unter *Zone der Wahrheit* | „Für den Spion. Falls ihr einen findet.\" |\n| **Kriechergeifer** | Kontakt | KON DC 13, sonst 1 Minute **gelähmt** (jede Runde neuer Wurf) | „Nicht an die eigenen Finger. Ich hab das gesehen.\" |\n| **Taggitöl** | Kontakt | KON DC 13, sonst 24 Stunden **bewusstlos** (wacht bei Schaden auf) | „Auf die Türklinke. Oder den Griff seiner Axt.\" |\n| **Verbrannte Othurdämpfe** | Eingeatmet | KON DC 13, 3W6 Gift und vergiftet; vergiftete Ziele wiederholen den Wurf jede Runde: 1W6 Gift pro Fehlschlag, nach drei Erfolgen endet es | „Fenster auf. Dann werfen. Nicht umgekehrt.\" |\n| **Ätheressenz** | Eingeatmet | KON DC 15, sonst 8 Stunden vergiftet und **bewusstlos** (wacht bei Schaden oder Wecken auf) | „Ein Turm voller schlafender Goblins. Denkt mal drüber nach.\" |\n| **Bosheit (Malice)** | Eingeatmet | KON DC 15, sonst 1 Stunde vergiftet und **blind** | „Für den mit der Ballista.\" |\n\n**Für den Erzähler:** Kazzamir und die Höllenfeuer-Maschine sind **immun\ngegen Gift**; der Gifttroll und der Schreckenstroll im Drachenhort\n(Kapitel 1c) auch. Alles andere\nim Buch nicht – Goblins, Hobgoblins, Orks, Bugbears, Champion, Hobgoblin-Verwüster,\nKriegspriester, Feuerriese, Fäulnistroll und die roten Drachen (die sind\nnur gegen Feuer immun, Gift wirkt). Gift ist\nhier die Antwort auf die Türme, nicht auf das Finale.\n\n---\n\n**Trankkarten zum Ausdrucken:** Zu jedem der elf Tränke gibt es eine\nKarte (oben Bild, unten Wirkung) unter `Trankkarten\\` – einzeln als\nPNG und als Druckbogen `Druckbogen-Trankkarten-A4.pdf`; die 14 Gifte\nplus eine Regelkarte liegen unter `Trankkarten\\Gifte\\` mit eigenem\nDruckbogen. Ansicht:\nhttps://claude.ai/artifact/K9YHSZc7TWUxQdFLbVRi5C\n\n*Unten auf dem Zettel, durchgestrichen und neu geschrieben:* „Zwei\npro Nase. ~~Drei.~~ Zwei. Die Männer brauchen auch welche.\"\n\n---\n\n**Für den Erzähler:** Die Liste ist mit Absicht stark. Feuerschutz gibt\nes nicht als Trank – dafür hat Orvin den **Glutschild** (→\n[Übersicht](#belohnungen-uebersicht)). Was die Helden am Abend nicht nehmen,\nbleibt im Koffer und taucht in Kapitel 5 (zwei weitere Tränke für die\nGruppe) wieder auf. Fällt in Kapitel 1b Toms Tasche weg, fehlen die\nVorzüglichen Heiltränke und das Purpurwurmgift, bis\ndie Helden sie zurückholen.\n"}, "npc-marschallin-hedda-beschreibung": {"title": "Beschreibung", "path": "NPC/Marschallin-Hedda/Beschreibung.md", "md": "# Marschallin Hedda Eisenbrecht\n\nOberbefehlshaberin des letzten Heeres Nordgars. Questgeberin des\nOneshots.\n\n## Erscheinung & Wesen\n\nFünfzig, grau, eine Narbe vom Ohr bis zum Kinn, die beim Lachen\nweiß wird. Trägt Plattenrüstung, als wäre es ein Leinenhemd. Spricht\nkurz, klar, ohne Pathos – Pathos überlässt sie anderen. Sie hat zwei\nSöhne im Heer und spricht mit keinem von ihnen anders als mit den\nanderen Soldaten.\n\n**Was sie antreibt:** Sie weiß, dass es die letzte Schlacht ist, die\nNordgar führen kann. Verliert sie, gibt es kein zweites Heer.\nDeshalb nimmt sie jede Hilfe, auch die von drei Abenteurern und einem\nKoch.\n\nWerte → [Stats](#npc-marschallin-hedda-stats-stats)\n"}, "npc-marschallin-hedda-stats-stats": {"title": "Stats", "path": "NPC/Marschallin-Hedda/Stats/Stats.md", "md": "# Marschallin Hedda Eisenbrecht – Statistiken\n\n*Veteranin (Kriegerin, Stufe 10). Sie kämpft auf der Ebene, nicht an\nder Seite der Helden – die Werte sind für den Notfall und für den\nFall, dass sie mit den Hauptleuten der Verbündeten die Höllenfeuer-\nMaschine aufhält, bis die Helden kommen (→\n[Stats](#npc-die-verbuendeten-stats-stats), Erzählerregel dort).*\n\n| | |\n|---|---|\n| Typ | Humanoid (Mensch), Mittelgroß |\n| RK | 19 (Plattenrüstung, Schild) |\n| TP | 120 |\n| Bewegung | 9 m |\n| STR 18 (+4) | GES 12 (+1) |\n| KON 16 (+3) | INT 13 (+1) |\n| WEI 15 (+2) | CHA 16 (+3) |\n| Rettungswürfe | STR +8, KON +7, WEI +6 |\n| Fertigkeiten | Athletik +8, Einsicht +6, Einschüchtern +7, Geschichte +5 |\n| Sprachen | Gemeinsprache, Zwergisch |\n| HG | 8 (Übungsbonus +4) |\n\n**Mehrfachangriff:** Zwei Angriffe mit dem Langschwert.\n**Langschwert:** Nahkampf +8, 1W8+4 Hieb.\n**Angriff – Befehl: Schlagt zu! (Bonusaktion, 1× pro Zug):** Hedda\nzeigt mit dem Schwert auf ein Ziel. Ein Verbündeter in 9 m, der sie\nhört, macht sofort mit seiner Reaktion einen Waffenangriff gegen dieses\nZiel, und Heddas eigener nächster Treffer darauf in dieser Runde macht\nzusätzlich **2W8 Hieb**.\n**Schutz – Unbeugsam (1× pro Kampf):** Fällt Hedda auf 0 TP, bleibt\nsie stattdessen auf **1 TP** stehen und erhält sofort **Zweite Luft**\n(1W10+10 TP) zurück.\n**Zweite Luft (1× pro Rast):** Bonusaktion, 1W10+10 TP.\n**Tatendrang (1× pro Rast):** Eine zusätzliche Aktion.\n"}, "npc-milo-klee-beschreibung": {"title": "Beschreibung", "path": "NPC/Milo-Klee/Beschreibung.md", "md": "# Milo Klee\n\nDer vierte Mann der Gruppe: Bauer, Koch, Heiler – und **NPC**, den der\nErzähler spielt. Er gehört zu den Helden wie ein Bruder, den man nicht\nbestellt hat, der aber immer etwas zu essen dabeihat.\n\n## Erscheinung & Wesen\n\nAnfang dreißig, breit, rund im Gesicht, Hände wie Schaufeln,\nSommersprossen bis in den Nacken. Trägt ein Lederwams über einer\nKüchenschürze, ein Hackbeil am Gürtel, eine schwere eiserne Bratpfanne\nauf dem Rücken und einen Beutel, aus dem es immer nach Zwiebeln,\nKräutern und Dörrfleisch riecht.\n\nMilo ist auf einem Hof aufgewachsen. Er hat Talent fürs **Heilen** und\nfür sonst nichts: Wunden schließen kann er, dazu ein einziger\nAngriffszauber, ein Flämmchen. Dafür kann er **kochen** wie kein\nanderer. Das Heer kennt ihn als den Mann, der nach dem Kampf zuerst die\nVerwundeten verbindet und dann den Kessel aufsetzt.\n\n**Sein Ziel:** Nach diesem Abenteuer sucht er sich eine **Stadt** und\nmacht eine **Bäckerei oder ein Wirtshaus** auf.\n\n**Werte:** Milos Charakterbogen – Kleriker 8, Lebensdomäne, 104 TP,\nRK 19 (→ [Stats](#npc-milo-klee-stats-stats)). Er kommt als NPC mit der Gruppe mit; der\nErzähler spielt ihn, die Spieler dürfen seine Heilung einfordern.\n\nWerte → [Stats](#npc-milo-klee-stats-stats) · Fähigkeiten → [Fähigkeiten](#npc-milo-klee-faehigkeiten-faehigkeiten)\n"}, "npc-milo-klee-faehigkeiten-faehigkeiten": {"title": "Fähigkeiten", "path": "NPC/Milo-Klee/Faehigkeiten/Faehigkeiten.md", "md": "# Milo Klee – Fähigkeiten\n\n## Milos Küche (nach jeder Rast)\n\nWenn Milo bei einer kurzen oder langen Rast zehn Minuten kochen kann\n(Feuer, Wasser, sein Beutel), bekommt jeder, der isst, **1W8+3\ntemporäre TP**, die bis zur nächsten Rast halten. Einmal pro Rast.\n"}, "npc-milo-klee-stats-stats": {"title": "Stats", "path": "NPC/Milo-Klee/Stats/Stats.md", "md": "# Milo Klee – Statistiken\n\n*Quelle: Milos Charakterbogen (D&D Beyond, 1.11.2026): **Mensch,\nKleriker Stufe 8, Domäne des Lebens.** Das Buch richtet sich nach dem\nBogen; der Zusatz aus [Fähigkeiten](#npc-milo-klee-faehigkeiten-faehigkeiten) (Milos Küche)\nkommt obendrauf. Milo ist damit ein\nvollwertiger Heiler – mithalten darf er, glänzen sollen die Helden.*\n\n| | |\n|---|---|\n| Typ | Humanoid (Mensch), Mittelgroß |\n| RK | 19 |\n| TP | 104 |\n| Initiative | +2 |\n| Bewegung | 9 m |\n| STR 8 (−1) | GES 14 (+2) |\n| KON 16 (+3) | INT 12 (+1) |\n| WEI 18 (+4) | CHA 10 (+0) |\n| Rettungswürfe | STR −1, GES +2, KON +3, INT +1, **WEI +7**, **CHA +3** |\n| Fertigkeiten | Heilkunde +7, Mit Tieren umgehen +7, Arkane Kunde +5, Religion +5, Geschichte +4, Motiv erkennen +4, Naturkunde +4, Wahrnehmung +4, Überleben +4, Akrobatik/Athletik/Fingerfertigkeit/Heimlichkeit +2, Nachforschungen +1 |\n| Passiv | Wahrnehmung 14, Motiv erkennen 14, Nachforschungen 11 |\n| Kenntnisse | Leichte und mittlere Rüstung, Schilde; einfache Waffen; Werkzeug Zimmermann und Koch |\n| Sprachen | Gemeinsprache, Drakonisch, Zwergisch |\n| Übungsbonus | +3 |\n| Schutz | Vor kritischen Treffern (laut Bogen) |\n\n**Glück und Ressourcen (Bogen):**\n- **Lucky Points:** 3 pro lange Rast. 1 Punkt: Vorteil auf einen\n  eigenen W20-Test oder Nachteil auf einen Angriffswurf gegen ihn.\n- **Heldenhafte Inspiration:** einen beliebigen Würfel neu würfeln;\n  als Mensch nach jeder langen Rast wieder da.\n\n**Angriffe (einfache Waffen):**\n- **Hackbeil:** Nahkampf +5, 1W6+2 Hieb; Wurf 6/18 m.\n- **Bratpfanne** (improvisiert): Nahkampf +5, 1W4+2 Wucht. Klingt\n  furchtbar.\n- **Heiliges Feuer** (Zaubertrick): 18 m, GES-Rettungswurf SG 15,\n  2W8 Strahlen (mit Potent Spellcasting 2W8+4). Sein einziger\n  Angriffszauber – „das Flämmchen\".\n\n**Zauberwirken:** Weisheit, Zauber-SG 15, Zauberangriff +7.\nZauberplätze **4× Grad 1, 3× Grad 2, 3× Grad 3, 2× Grad 4**.\nHeilwerte inklusive Lebensdomäne-Bonus:\n\n| Zauber | Art | Grad 1 | Grad 2 | Grad 3 | Grad 4 |\n|---|---|---|---|---|---|\n| **Totenruhe** | Zaubertrick, Aktion, 9 m | stabilisiert eine Kreatur mit 0 TP | | | |\n| **Heilendes Wort** | Bonusaktion, 18 m, 1 Ziel | 2W4+7 | 4W4+8 | 6W4+9 | 8W4+10 |\n| **Heilende Hand** | Aktion, Berührung | 2W8+7 | 4W8+8 | 6W8+9 | 8W8+10 |\n| **Heilendes Wort, Masse** | Bonusaktion, 18 m, bis 6 Ziele | | | 2W4+9 | 3W4+10 |\n| **Gebet der Heilung** | 10 Minuten, 9 m, bis 5 Kreaturen | | 2W8+4 | 3W8+5 | 4W8+6 (je Ziel, plus kurze Rast; je Ziel 1× pro lange Rast) |\n| **Wiederbeleben** | Aktion, Berührung, Tod vor höchstens 1 Minute | | | Diamant 300 GM, verbraucht | gleich |\n\n**Göttliche Macht** (Aktion, 9 m, 3 Anwendungen pro lange Rast, 1 nach\nkurzer Rast zurück):\n- **Göttlicher Funke:** 2W8+4 TP heilen – oder Schaden: KON SG 15,\n  2W8+4 nekrotisch/strahlend, Erfolg halbiert.\n- **Leben bewahren:** 40 TP verteilen auf Ziele mit höchstens halben\n  maximalen TP, nur bis zur Hälfte ihres Maximums.\n\n**Für den Erzähler:** Milo heilt pro Runde locker 15 bis 25 TP, und\n*Wiederbeleben* nimmt dem Tod eines Helden die Spitze. Die Kämpfe\nim Buch sind bewusst über «hoch» gerechnet; mit diesem Milo passt das.\nMilo greift mit dem Flämmchen an, wenn niemand Heilung braucht, und\nsonst nie.\n\nFähigkeiten → [Fähigkeiten](#npc-milo-klee-faehigkeiten-faehigkeiten)\n"}, "npc-rittmeisterin-lenja-beschreibung": {"title": "Beschreibung", "path": "NPC/Rittmeisterin-Lenja/Beschreibung.md", "md": "# Rittmeisterin Lenja Sturmfeder\n\nAnführerin der Greifenstaffel Nordgars – vier Greifen, vier\nReiter, die einzige Luftmacht, die das Heer hat. Nur eine\nCharakterbeschreibung: Lenja braucht keine Werte, und was sie in den\nKapiteln tut, wird am Tisch improvisiert.\n\n## Erscheinung & Wesen\n\nZwergin, Mitte dreißig, stämmig, breite Schultern, ein wettergegerbtes\nGesicht. Dichtes dunkles Haar, lang und zu einem dicken Zopf geflochten,\nden sie beim Fliegen unter den Kragen stopft; darin eine Greifenfeder.\nSitzt auf dem Greifen, als wäre sie dort geboren; am Boden geht sie\nbreitbeinig und ungeduldig. Redet mit ihren Tieren mehr als mit Leuten\nund behandelt Leute wie Tiere, die noch nicht gut abgerichtet sind:\nknapp, freundlich, ohne Geduld. Wer einem Greifen etwas antut, hat Lenja\nzum Feind – für immer.\n\n**Ihre Greifen:** *Sturm* (ihr eigener, der größte), *Schiefer*,\n*Mohn* und *Grauwind*. Werte der Tiere und die Regel für den großen\nBarbaren → [Stats](#npc-rittmeisterin-lenja-stats-stats).\n"}, "npc-rittmeisterin-lenja-stats-stats": {"title": "Stats", "path": "NPC/Rittmeisterin-Lenja/Stats/Stats.md", "md": "# Die Greifen der Staffel – Statistiken\n\nLenja selbst hat keine Werte (nur Charakterbeschreibung, →\n[Beschreibung](#npc-rittmeisterin-lenja-beschreibung)). Hier stehen die vier Greifen.\n\n## Greif (4 Stück: Sturm, Schiefer, Mohn, Grauwind)\n\n| | |\n|---|---|\n| Typ | Monstrosität, Groß |\n| RK | 12 |\n| TP | 59 (Sturm: 70) |\n| Bewegung | 9 m, Fliegen 24 m |\n| STR 18 (+4) | GES 15 (+2) |\n| KON 16 (+3) | INT 2 (−4) |\n| WEI 13 (+1) | CHA 8 (−1) |\n| Sinne | Dunkelsicht 18 m, Wahrnehmung +5 |\n| HG | 2 |\n\n**Mehrfachangriff:** Schnabel (Nahkampf +6, 1W8+4 Stich) und Klauen\n(Nahkampf +6, 2W6+4 Hieb).\n\n**Trägt:** Einen Reiter plus einen Passagier (mittelgroß). Mit zwei\nPassagieren fliegt der Greif halb so schnell.\n\n**Der große Barbar (fast 3 m / 10 Fuß):** Ein normaler Greif trägt ihn.\nDer Charakter bleibt regeltechnisch **mittelgroß**, der Greif ist **groß**\n(ein Reittier muss eine Größe über dem Reiter liegen) und hat mit STR 18\neine Tragkraft von 540 Pfund / rund 245 kg – das reicht für Barbar, Rüstung\nund Gepäck. Nur wenn er im Kampf **groß** wird (*Vergrößern*, Rune Knight),\nbräuchte er ein riesiges Reittier; auf dem Greifen also vorher nicht\nwachsen.\n\n"}, "npc-schmied-orvin-beschreibung": {"title": "Beschreibung", "path": "NPC/Schmied-Orvin/Beschreibung.md", "md": "# Schmied Orvin Glutfaust\n\nDer Feldschmied des Heeres. Arbeitet in Kapitel 1 die ganze Nacht\ndurch, damit die Helden morgen besser bewaffnet sind.\n\n## Erscheinung & Wesen\n\nZwerg, Bart mit Funkenlöchern, Lederschürze, Unterarme wie Schinken.\nRedet nicht viel, und wenn, dann in Hammerschlägen.\n\n**Schliffe** (Kapitel 1, Belohnung): jede Waffe +1 (nie über +2), wer\neinen Schild trägt, Feuerresistenz darauf (10 Stunden, vor der Schlacht\naktiviert), dazu 12 Feuerpfeile für die Gruppe – bis zum Ende des\nAbenteuers (→\n[Fähigkeiten](#npc-schmied-orvin-faehigkeiten-faehigkeiten), [Übersicht](#belohnungen-uebersicht)).\n\nWerte → [Stats](#npc-schmied-orvin-stats-stats) · Fähigkeiten → [Fähigkeiten](#npc-schmied-orvin-faehigkeiten-faehigkeiten)\n"}, "npc-schmied-orvin-faehigkeiten-faehigkeiten": {"title": "Fähigkeiten", "path": "NPC/Schmied-Orvin/Faehigkeiten/Faehigkeiten.md", "md": "# Schmied Orvin Glutfaust – Fähigkeiten\n\n## Schlachtschliff (Kapitel 1)\n\nÜber Nacht, für jeden Helden. Alle Schliffe halten **bis zum Ende des\nAbenteuers** (Kapitel 7), danach ist die Arbeit abgenutzt. So bleiben\ndie Helden für alles danach unverändert.\n\n- **Scharf** (jeder Held): eine Waffe +1 auf Angriff und Schaden, nie\n  über **+2** insgesamt.\n- **Glutschild** (jeder, der einen Schild tragen will; nur Schilde):\n  vor der Schlacht aktiviert, 10 Stunden Resistenz gegen Feuer – für\n  die Feldschlacht, nicht mehr für das Finale.\n- **Feuerpfeile** (12 Stück, einmal für die Gruppe): +3W6 Feuer pro\n  Treffer (→ [Übersicht](#belohnungen-uebersicht)).\n"}, "npc-schmied-orvin-stats-stats": {"title": "Stats", "path": "NPC/Schmied-Orvin/Stats/Stats.md", "md": "# Schmied Orvin Glutfaust – Statistiken\n\n| | |\n|---|---|\n| Typ | Humanoid (Zwerg), Mittelgroß |\n| RK | 14 (Lederschürze zählt als Leder + Zwergensturheit) |\n| TP | 52 |\n| Bewegung | 7,5 m |\n| STR 18 (+4) | GES 10 (+0) |\n| KON 17 (+3) | INT 12 (+1) |\n| WEI 13 (+1) | CHA 9 (−1) |\n| Fertigkeiten | Athletik +7, Geschichte +4 (Waffen und Belagerung) |\n| Werkzeuge | Schmiedewerkzeug +7 |\n| Sprachen | Gemeinsprache, Zwergisch |\n| HG | 2 |\n\n**Schmiedehammer:** Nahkampf +7, 1W8+4 Wucht (zweihändig 1W10+4).\n\nFähigkeiten → [Fähigkeiten](#npc-schmied-orvin-faehigkeiten-faehigkeiten)\n"}, "npc-silberdrachin-argentys-beschreibung": {"title": "Beschreibung", "path": "NPC/Silberdrachin-Argentys/Beschreibung.md", "md": "# Argentys, die Sturmhüterin\n\nDie uralte Silberdrachin (Uralter Silberdrache, HG 23), die das **Sturmgebiet** rechts der\nFelswände kontrolliert (→ [Sturmgebiet](#orte-sturmgebiet)). Optionaler\nVerbündeter – nur, wenn die Helden sie **freischalten**.\n\n## Erscheinung\n\nAls Drachin: Schuppen wie poliertes Silber, in denen sich die Wolken\nspiegeln; Schwingen so breit wie eine Straße; Augen aus hellem Blau.\nAls Mensch: eine hochgewachsene Frau mit silbergrauem Haar, barfuß,\nin einem Mantel, der im Wind nie flattert. Spricht mit einer Stimme\n„wie Eis auf Glas\".\n\n## Wesen\n\nAlt, stolz, nicht grausam – aber auch nicht freundlich. Sie hat vor\ndreißig Jahren das Sturmgebiet zu ihrem Himmel gemacht, nachdem die\nNordgar ihren Horst mit Ballisten beschossen hatte („ein\nMissverständnis\", sagt Nordgar; „ein Versuch\", sagt sie). Seitdem\nlässt sie niemanden durch. Kein Groll – eine Grenze.\n\n## Freischaltung (Kapitel 1)\n\nArgentys ist **nur dann** im Spiel, wenn die Helden in Kapitel 1\nfragen, ob man die Drachin überzeugen könnte, und dann den\n**Sturmmagier Elion** schicken (→ [Beschreibung](#npc-sturmmagier-elion-beschreibung); oder\nselbst fliegen, → Kapitel 1, Szenario D, oder in der langen Fassung\nKapitel 1c: Dort\nliegt sie in Ketten an einem Siegelstein, mit dem ein Lich aus dem\nNorden sie hereingelegt hat, und die Helden befreien sie mit ihrem\nSchwert Silberzahn). Elion kehrt **nicht** vor\nder Schlacht zurück – er kommt in Kapitel 4 auf Argentys' Rücken.\nBis dahin wissen die Helden nur: Er ist losgeflogen.\n\nNicht freigeschaltet: Sie bleibt in ihren Wolken. Die Helden sehen in\nKapitel 4 nur, wie weit rechts ein silberner Blitz durch die Wolken\nzuckt. Mehr nicht. Kein Vorwurf.\n\nWerte → [Stats](#npc-silberdrachin-argentys-stats-stats) · Fähigkeiten → [Fähigkeiten](#npc-silberdrachin-argentys-faehigkeiten-faehigkeiten)\n"}, "npc-silberdrachin-argentys-faehigkeiten-faehigkeiten": {"title": "Fähigkeiten", "path": "NPC/Silberdrachin-Argentys/Faehigkeiten/Faehigkeiten.md", "md": "# Argentys, die Sturmhüterin – Fähigkeiten\n\n## Hüterin des Sturms (Story-Fähigkeit)\n\nIm Sturmgebiet (→ [Sturmgebiet](#orte-sturmgebiet)) kontrolliert Argentys Wind\nund Wolken. Niemand fliegt hindurch, ohne dass sie es will. Wer es\nversucht, wird abgedrängt (Böen: Tierkunde DC 18 pro Runde, sonst\n3W6 Wucht und 18 m zurückgeworfen).\n\n## Die Schwinge (Reaktion, Kapitel 4)\n\nFällt ein Held in Sichtweite, fängt Argentys ihn auf: **kein\nSturzschaden**, der Held landet mit ihr. Keine Probe – das ist ihr\nVersprechen aus Kapitel 1. Sie fängt so viele, wie fallen. „Ich lasse\nheute niemanden fallen. Nur die anderen.\"\n\n## Das Duell (Kapitel 4, von einem Spieler geführt)\n\nIn der Schlacht auf der Ebene bekommt ein Spieler ihren Bogen und führt sie auf Initiative\n24: Sturzflug auf den Kessel und die Bombardiere der Hellfire Engine (dreimal Zerfetzen) **oder** Kälteodem auf die Horde\n**oder** Lähmungsodem **oder** die Schwinge. Solange sie über der\nMaschine hängt, schießt die Maschine auf sie statt aufs Heer\n(→ Kapitel 4, Szenario D). Bei 0 TP zieht sie sich ins Sturmgebiet\nzurück; sie stirbt nicht.\n\n## Eine Bitte (1× pro Kampf)\n\nArgentys erfüllt eine **konkrete, kurze Bitte** der Helden\n(Überzeugen DC 12 – eine Freundlichkeit, keine Prüfung): einen Weg\nfreiräumen, einen Abschnitt mit Kälteodem leeren, Lärm machen, damit\ndie Horde nach oben schaut. Nie: ein Ziel für die Helden töten.\n"}, "npc-silberdrachin-argentys-stats-stats": {"title": "Stats", "path": "NPC/Silberdrachin-Argentys/Stats/Stats.md", "md": "# Argentys, die Sturmhüterin – Statistiken\n\n*Uralter Silberdrache, Werte unverändert aus dem Monsterhandbuch 2024\n(Entscheid 2026-10-25). Druckbogen A4 mit Bild und Würfelformeln:\n`Monsterboegen/01-Uralter-Silberdrache-Argentys.pdf`. In Kapitel 4\nführt ein **Spieler** sie gegen die Höllenfeuer-Maschine.*\n\n| | |\n|---|---|\n| Typ | Drache (metallisch), Gigantisch, rechtschaffen gut |\n| RK | 22 |\n| TP | 468 (24W20+216) |\n| Initiative | +14 (24) |\n| Bewegung | 12 m, Fliegen 24 m |\n| STR 30 (+10), RW +10 | GES 10 (+0), RW +7 |\n| KON 29 (+9), RW +9 | INT 18 (+4), RW +4 |\n| WEI 15 (+2), RW +9 | CHA 26 (+8), RW +8 |\n| Fertigkeiten | Geschichte +11, Wahrnehmung +16, Heimlichkeit +7 |\n| Immunitäten | Kälte |\n| Sinne | Blindsicht 18 m, Dunkelsicht 36 m, passive Wahrnehmung 26 |\n| Sprachen | Gemeinsprache, Drakonisch |\n| HG | 23 (50.000 EP, im Hort 62.000; Übungsbonus +7) |\n\n**Legendäre Resistenz (4/Tag, im Hort 5/Tag).**\n\n**Mehrfachangriff:** dreimal Zerfetzen. Einen Angriff darf sie durch\nLähmungsodem oder Eismesser ersetzen.\n\n- **Zerfetzen:** Nahkampf +17, Reichweite 4,5 m, 2W8+10 Hieb + 2W8 Kälte.\n- **Kälteodem (Aufladung 5–6):** Kegel 27 m, RW KON 24, 15W8 Kälte,\n  halb bei Erfolg. Gegen die Horde: räumt einen Abschnitt der Ebene.\n- **Lähmungsodem:** Kegel 27 m, RW KON 24. 1. Misserfolg kampfunfähig\n  bis Ende ihres nächsten Zuges, dann neuer RW; 2. Misserfolg gelähmt\n  (RW am Ende jedes Zuges, nach 1 Minute automatisch Erfolg).\n- **Zauberwirken (CHA, SG 23, +15):** beliebig oft Magie entdecken,\n  Monster festhalten, Eismesser (Grad 2), Gestaltwandel (nur Tier oder\n  Humanoide); je 1/Tag Wetterkontrolle, Eissturm (Grad 7), Teleportieren,\n  Zone der Wahrheit.\n\n**Legendäre Aktionen (3, im Hort 4):** Frosthauch (Monster festhalten,\nRW WEI 23), Kältesturm (Linie 18 m × 3 m, RW GES 23, 4W6 Kälte und\n9 m weggestossen), Ansprung (halbe Bewegung, ein Zerfetzen).\n\nFähigkeiten → [Fähigkeiten](#npc-silberdrachin-argentys-faehigkeiten-faehigkeiten)\n"}, "npc-soldaten-und-trupp-eisenwacht-beschreibung": {"title": "Beschreibung", "path": "NPC/Soldaten-und-Trupp-Eisenwacht/Beschreibung.md", "md": "# Soldaten und Trupp Eisenwacht\n\nDie Nebenfiguren des Heeres: der Soldat, der die Helden holt, der\nHauptmann der Eisenwacht mit seinen Meuchlern, und sechs Soldaten für\ndie zwei Ess- und Trinkszenen. **Keiner von ihnen hat einen festen\nAuftritt** – sie sind da, wenn ein Spieler sie anspricht, und sonst\nnur Kulisse. Werte braucht niemand von ihnen; wer doch welche will,\nnimmt Wache (Soldaten), Veteran (Hauptmann) oder Spion (Meuchler).\n\n## Der Bote: Soldat Bastian Kolk\n\nMensch, Anfang zwanzig, zwei Finger an der linken Hand fehlen seit\nheute Morgen (verbunden). Übertrieben förmlich, weil er Angst vor der\nMarschallin hat. Holt die Helden zu Hedda, wenn sie nicht von selbst\ngehen.\n\n## Hauptmann Corvin Rask (Trupp Eisenwacht)\n\nMensch, Mitte vierzig, grau an den Schläfen, eine Narbe quer über die\nKehle, deshalb spricht er heiser und leise. Führt die **Eisenwacht**:\nacht Meuchler, die das Heer für die Arbeit braucht, von der man nicht\nsingt. Hedda vertraut ihm blind.\n\n- **Sein Auftrag:** Die **linken Türme** nehmen – leise, in derselben\n  Nacht wie die Helden rechts. Er fragt die Helden genau, wie sie rechts\n  vorgehen wollen, damit nicht beide Trupps dasselbe Signalhorn auslösen.\n- Rask überlebt immer.\n\n### Die Eisenwacht (acht Meuchler, vier davon mit Namen)\n\n- **Jorik** – Heddas Sohn (→ [Beschreibung](#npc-marschallin-hedda-beschreibung)). Zwanzig, trägt\n  ihr altes Kurzschwert.\n- **Ilva Kurzschritt** – Halbling, die Kletterin des Trupps.\n- **Kessa Vorrin** – Mensch, kämpft mit Drahtschlinge und Dolch. Hat\n  in Dunmar als Garrotte-Mörderin für die Krone gearbeitet; niemand hat\n  sie je kommen hören.\n- **Ruben Tal** – Mensch, Messerwerfer, der einzige, der redet.\n\n## Die Siegesfeier auf Rabenwacht (Kapitel 1)\n\nDrei Soldaten am Feuer, für Spieler, die mit jemandem reden wollen:\n\n- **Koch Melle** – Mensch, dick, Schürze voller Brandlöcher, führt die\n  Küche aus einem Karren.\n- **Wenzel Brack** – Mensch, alt, ein Ohr fehlt. War vierzig Jahre\n  Torwächter auf Rabenwacht, bis die Horde die Burg im Frühjahr nahm;\n  das Ohr hat ihm dabei ein Hobgoblin genommen. Heute ist er zum ersten\n  Mal seit dem Frühjahr wieder zu Hause und kennt hier jeden Stein. Er\n  weiß, wo im Keller der gute Wein eingemauert war, und ob die Goblins\n  ihn gefunden haben.\n- **Tilda Fenn** – Zwergin der Hammergarde aus Dhurgan (→\n  [Beschreibung](#npc-die-verbuendeten-beschreibung)), Armbrustschützin, sammelt Goblinzähne an\n  einer Schnur. Nüchtern, trocken, lacht nie, trinkt jeden unter den\n  Tisch. Das Wetttrinken (wird am Schluss noch ausgearbeitet).\n\n## Rast und Siegestrunk im Hordenlager (Kapitel 5)\n\nDrei andere Gesichter, müder, leiser:\n\n- **Hauke Dorn** – Mensch, Pionier, hat heute die Karren aus der\n  Verengung gezogen. Hände offen, schläft im Sitzen ein.\n- **Brida Steinhand** – Zwergin, Feldscherin der Hammergarde aus Dhurgan\n  (→ [Beschreibung](#npc-die-verbuendeten-beschreibung)), Schürze bis oben voll Blut, das nicht\n  ihres ist.\n- **Ole Vinter** – Mensch, Trommler, sechzehn, viel zu jung, hat heute\n  zum ersten Mal einen Toten angefasst.\n"}, "npc-soldaten-und-trupp-eisenwacht-stats-stats": {"title": "Stats", "path": "NPC/Soldaten-und-Trupp-Eisenwacht/Stats/Stats.md", "md": "# Die Schildträger – Truppengruppen fürs Schlachtfeld\n\nDamit das Heer auf der Ebene spielbar bleibt, kämpft es nicht als\ntausend Einzelfiguren, sondern in **Gruppen zu je 20 Soldaten**. Eine\nGruppe ist ein Block mit **einem** Angriff und **einem** Lebenspool;\ndie Werte sind die des **Veterans** (Monsterhandbuch 2024,\n`Monster-Screenshots/Veteran.png`), der Schaden ist ein fester\nDurchschnittswert, damit niemand würfeln muss außer für den Treffer.\n\n## Schildträger (Veteranen-Gruppe)\n\n| | |\n|---|---|\n| Stärke | 20 Soldaten pro Gruppe, **5 Gruppen** |\n| RK | 17 (Schienenpanzer, große Schilde) |\n| Lebenspool | **65 pro Gruppe** |\n| Angriff | **+5**, Treffer: **12 Schaden** (fest, kein Würfeln) |\n| Initiative | **keine** – die Gruppen handeln am **Ende jeder Runde**, nach allen anderen |\n| Bewegung | 9 m / 30 Fuß |\n\n- **Eine Gruppe fällt**, wenn ihr Pool auf 0 ist: Sie ist nicht tot bis\n  auf den letzten Mann, aber zerschlagen, und kämpft heute nicht mehr.\n- **Jede Gruppe hat ihren eigenen Pool.** Ein Angriff trifft immer nur\n  eine Gruppe, auch Flächenschaden wie Drachenfeuer; der Erzähler\n  bestimmt welche und steuert so, wie hart es wird. *Harte Variante:*\n  ein gemeinsamer Pool für alle (5 Gruppen = 325), je volle 65 Verlust\n  eine Gruppe weniger.\n\n## Einsatz\n\n- **Kapitel 3, Szene 4 (Drachenjagd):** Die fünf Gruppen stehen auf der\n  Ebene unter den Drachen. Sie sind das Ziel der Flammenattacken und\n  schlagen zurück, wenn ein Drache tief über sie hinwegfliegt.\n- **Kapitel 4 (Schlacht auf der Ebene):** Die Gruppen, die die\n  Drachenjagd überstanden haben, stehen in der Linie des Heeres. Die\n  Gegnergruppen der Horde (Goblin-Krieger, Goblin-Boss, Worg, Berserker,\n  Oger-Kettenschläger als 20er-Blöcke) folgen in Kapitel 4, sobald sie\n  abgenommen sind.\n\n## Erzähler-Hinweis\n\nDie Gruppen sind Kulisse mit Zahlen. Nenne sie nie «Gruppe 3», sondern\n«die Schildträger links», «der Block vor der Verengung». Fällt eine\nGruppe, sag es laut und in einem Satz aus der Fiktion – die Spieler oben\nauf dem Turm müssen es hören.\n"}, "npc-sturmmagier-elion-beschreibung": {"title": "Beschreibung", "path": "NPC/Sturmmagier-Elion/Beschreibung.md", "md": "# Elion Wolkenrath, der Sturmmagier\n\nDer Bote ins Sturmgebiet – **nur**, wenn die Helden in Kapitel 1\nfragen, ob man die Silberdrachin überzeugen könnte. Hedda schlägt ihn\ndann vor: Er spricht **Drakonisch**, er war drei Jahre Unterhändler am\nHof des Fürsten, und er ist der einzige Magier des Heeres, der im\nSturm fliegen kann.\n\n## Erscheinung & Wesen\n\nMitte vierzig, hager, graue Schläfen, ein Mantel, der bei jedem Wind\nin die falsche Richtung weht. Spricht leise und vollständig – Elion\nbeendet jeden Satz, auch wenn jemand dazwischenredet. Er ist kein\nKämpfer und sagt das als Erstes. „Ich bin Diplomat. Ich bringe Worte\nhin und Antworten zurück. Wenn ihr etwas anderes braucht, nehmt\njemand anderen.\"\n\nWerte → [Stats](#npc-sturmmagier-elion-stats-stats) · Fähigkeiten → [Fähigkeiten](#npc-sturmmagier-elion-faehigkeiten-faehigkeiten)\n"}, "npc-sturmmagier-elion-faehigkeiten-faehigkeiten": {"title": "Fähigkeiten", "path": "NPC/Sturmmagier-Elion/Faehigkeiten/Faehigkeiten.md", "md": "# Elion Wolkenrath – Fähigkeiten\n\n## Der Unterhändler (Kapitel 1)\n\nElion fliegt zur Silberkanzel, wartet, und Argentys kommt. Ihre Frage:\n*„Warum sollte ich ein Land verteidigen, das meinen Himmel nie\nrespektiert hat?\"*\n\nElion antwortet **zuerst mit dem Satz der Helden** (den sie ihm in\nKapitel 1 mitgegeben haben) – wörtlich. Dann mit seinem eigenen:\n„Weil es nicht um das Land geht. Es geht um die, die Ketten tragen.\nUnd weil Nordgar vor dreißig Jahren einen Fehler gemacht hat, den\nheute niemand mehr wiederholen würde. Ich bin hier, um das zu sagen,\nbevor Ihr es sagen müsst.\"\n\n**Wurf:** Überzeugen +5 gegen DC 15 – **mit Vorteil**, wenn der Satz\nder Helden ehrlich war (Erzählerentscheidung; ein Spruch wie „Wir\nzahlen gut\" gibt Nachteil). Erfolg: Argentys ist freigeschaltet.\nMisserfolg: Sie schickt ihn zurück, ohne Groll; Elion kehrt im\nMorgengrauen zurück und sagt den Helden ehrlich, woran es lag.\n\nWer den Wurf nicht verdeckt machen will: Lass die Spieler für Elion\nwürfeln. Es ist ihr Satz.\n"}, "npc-sturmmagier-elion-stats-stats": {"title": "Stats", "path": "NPC/Sturmmagier-Elion/Stats/Stats.md", "md": "# Elion Wolkenrath – Statistiken\n\nWerte wie **Magier** (Monsterhandbuch, Anhang NPCs), nur zur Sicherheit\n– er kämpft in diesem Oneshot nicht.\n\n| | |\n|---|---|\n| RK | 12 (15 mit *Magierrüstung*) |\n| TP | 40 (9W8) |\n| Bewegung | 9 m |\n| STR 9 (−1) | GES 14 (+2) |\n| KON 11 (+0) | INT 17 (+3) |\n| WEI 12 (+1) | CHA 15 (+2) |\n| Rettungswürfe | INT +6, WEI +4 |\n| Fertigkeiten | Arkana +6, Geschichte +6, Überzeugen +5, Einsicht +4 |\n| Sprachen | Gemeinsprache, **Drakonisch**, Riesisch, Elfisch |\n| HG | 6 |\n\n**Zauber (Magier, Stufe 9):** *Magierrüstung, Federfall, Nebelschritt,\nWindstoß, Fliegen, Blitz, Gegenzauber, Wind kontrollieren\n(statt Eiswand – sein Spezialgebiet), Dunkelsicht.*\n\nFür den Flug ins Sturmgebiet nutzt er *Federfall* und *Wind\nkontrollieren*. Er schafft die Würfe des\nSturmflugs (→ [Sturmgebiet](#orte-sturmgebiet)) automatisch – das ist der Grund,\nwarum Hedda ihn vorschlägt.\n"}, "feinde-uebersicht": {"title": "Kampfübersicht", "path": "Feinde/Uebersicht.md", "md": "# Kampfübersicht – wer kämpft wo\n\nAlle Gegner des Oneshots, Kampf für Kampf in Spielreihenfolge. Jede Zeile\nnennt Monsterbezeichnung, Anzahl, Herausforderungsgrad (HG), RK und TP.\n**Quelle der Werte:** Monsterhandbuch 2024 (MM) und Monsters of the\nMultiverse (MotM); die Statblock-Bilder in `Monster-Screenshots/` gelten,\ndie gedruckten Bögen liegen in [Monsterkarten](#monsterboegen-monsterkarten). Erfunden sind nur die\nNamen Kazzamir und Nadel – alles andere trägt seine Monsterbezeichnung.\n\n**Kein Kampf** in Kapitel 1 (Kriegsrat und Siegesfeier), Kapitel 5\n(Hordenlager: die Horde flieht, die Helden ziehen kampflos ein) und\nKapitel 7 (Nach der Schlacht).\n\nWer vier Kämpfer der Stufe 8 am Tisch hat, darf die Kämpfe bewusst über\n«hoch» liegen lassen; wo es eine leichtere Fassung gibt, steht sie dabei.\n\n---\n\n## Kapitel 1b – Der Tunnel des Spions (optional)\n\n**Hinterhalt in der Wurzelkammer** des Fluchtgangs\n(→ [Der Fluchtgang](#orte-der-fluchtgang)).\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Assassine («Nadel») | 1 | 8 | 16 | 97 | MM |\n| Bugbear-Pirscher | 2 | 3 | 15 | 65 | MM |\n| Bugbear-Krieger (Pitt) | 1 | 1 | 14 | 33 | MM |\n\n- Nadel hängt in den Wurzeln über dem Eingang: Meuchelangriff auf den\n  Verletzlichsten, dann Rückzug ins Dunkel und Armbrust. Drei Angriffe\n  pro Runde (+7, 1W6+4 Stich plus 5W6 Gift; Armbrust 1W8+4 plus 6W6 Gift).\n  Fallen beide Pirscher, flieht sie; gefangen redet sie gegen Gold.\n- Pitt ergibt sich unter 15 TP. Gewinn: nur Toms Tränke.\n- **Leichter:** Nadel mit den Werten eines Bugbear-Pirschers.\n\n---\n\n## Kapitel 1c – Der Drachenhort (optional)\n\nDungeon in drei Teilen: **Ebene 1, Ebene 2, Bossraum**\n(→ [Drachenhort](#orte-drachenhort)). Nur Bestien des Sturmgebiets, keine Horde.\n\n### Ebene 1\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Mantikor | 2 | 3 | 14 | 68 | MM |\n| Winterwolf | 4 | 3 | 13 | 75 | MM |\n| Chimäre | 2 | 6 | 14 | 114 | MM |\n\n- Die Mantikore sprechen und handeln: Wer Fleisch verspricht, lockt sie\n  mit **Überzeugen DC 14** vorbei; wer dabei lügt, bekommt die doppelte\n  Ladung Stacheln. Die Wölfe handeln nicht und fliehen nicht.\n- Die Chimären atmen auf den Eingang, sobald zwei Helden beieinander\n  stehen; dann Rammen (Ziel liegt) und Biss mit Vorteil (4W6+4). Keine\n  Verhandlung.\n- Mantikore und Wölfe zusammen 4 200 EP, die Chimären 4 600 EP = je\n  «mittel» für vier Kämpfer Stufe 8. **Leichter:** zwei Winterwölfe,\n  eine Chimäre.\n\n### Ebene 2\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Gifttroll | 1 | 7 | 15 | 94 | MotM |\n| Troll | 2 | 5 | 15 | 94 | MM |\n\n- Am Abstieg ein Rastplatz mit zwei **Ölfässern der Horde** = Feuer gegen\n  die Trolle.\n- Die Trolle kommen mit Sturmangriff aus den Nischen (3× Reißen, 3 m\n  Reichweite) und greifen den an, der am meisten blutet. Der Gifttroll\n  bleibt in der Mitte: Jeder Treffer gegen ihn spritzt 2W8 Gift auf alle\n  in 1,5 m; stehen mehrere um ihn, Giftsprühen (KON DC 16, 4W8).\n- **Alle drei regenerieren** (10 bzw. 15 TP pro Zug). Nur Feuer oder\n  Säure setzt das aus; ohne Feuer stehen sie immer wieder auf.\n- 6 500 EP = «hoch». **Leichter:** ein Troll (4 700 EP, «mittel»).\n\n### Bossraum – Schatzkammer\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Schreckenstroll | 1 | 13 | 15 | 172 | MotM |\n\n- Allein, keine Helfer. Biss und **vier** Klauen (je +11, 3 m\n  Reichweite, rund 80 Schaden pro Runde auf ein Ziel), Klauenwirbel\n  (GES DC 19, 8W10 auf alle in 3 m). Resistenz gegen nichtmagische\n  Waffen (spielt bei Orvins Schliffen keine Rolle).\n- **Stirbt nur**, wenn er bei 0 TP von einem Angriff mit mindestens 10\n  Feuer- oder Säureschaden getroffen wird; sonst steht er im nächsten\n  Zug wieder auf. Feuerquellen: Ölfässer, Trank des Feueratems,\n  Feuerpfeile (→ [Übersicht](#belohnungen-uebersicht)).\n- 10 000 EP, deutlich über «hoch» – mit Absicht. Nicht abschwächen, die\n  Rast am Abstieg großzügig geben.\n\n---\n\n## Kapitel 2 – Wachposten am Rampenfuß\n\nNur auf dem **leisen** Weg ein Kampf (dreist: Losung «Kettenbruch»).\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Goblin | 4 | 1/4 | 15 | 7 | MM |\n| Worg | 2 | 1/2 | 13 | 26 | MM |\n| Goblin-Boss | 1 | 1 | 17 | 21 | MM |\n\n- Der Goblin-Boss rennt die Rampe hoch und warnt die untere Barrikade,\n  wenn er nicht aufgehalten wird.\n\n---\n\n## Kapitel 3 – Rampe und Geschütztürme\n\nWer wo steht (einzige Quelle: [Felsenpass](#orte-felsenpass)):\n\n| Stelle | Besatzung |\n|---|---|\n| **Rampe, untere Barrikade** | 2 Hobgoblin-Krieger, 1 Goblin-Boss |\n| **Rampe, obere Barrikade** | 2 Hobgoblin-Krieger, 1 Hobgoblin-Hauptmann, 1 Oger-Kettenschläger |\n| **Turm 1 rechts** | 2 Hobgoblin-Krieger, 1 Hobgoblin-Hauptmann, 2 Bogenschützen, 2 Oger-Bolzenschleudern, 1 Hobgoblin-Verwüster |\n| **Der Zwischenraum** | 3 Hobgoblin-Eisenschatten |\n| **Turm 2 rechts** | 2 Hobgoblin-Krieger, 1 Hobgoblin-Hauptmann, 1 Oger-Kettenschläger, 1 Champion |\n\n*Quelle: [Felsenpass](#orte-felsenpass) – Änderungen nur dort.*\n\n**Alle Kreaturen dieses Kampfes** (Summen über Rampe, beide Türme und den\nZwischenraum):\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Hobgoblin-Krieger | 8 | 1/2 | 18 | 11 | MM |\n| Goblin-Boss (Hornist, untere Barrikade) | 1 | 1 | 17 | 21 | MM |\n| Hobgoblin-Hauptmann | 3 | 3 | 17 | 39 | MM |\n| Oger-Kettenschläger | 2 | 3 | 11 | 59 | MotM |\n| Bogenschütze | 2 | 3 | 16 | 75 | MotM |\n| Oger-Bolzenschleuder | 2 | 2 | 13 | 59 | MotM |\n| Hobgoblin-Verwüster | 1 | 4 | 13 | 45 | MotM |\n| Hobgoblin-Eisenschatten | 3 | 2 | 15 | 32 | MotM |\n| Champion | 1 | 9 | 18 | 143 | MotM |\n\n- **Alarm:** Der Goblin-Boss an der unteren Barrikade bläst in Runde 1\n  das Horn; Alarmstufen → [Felsenpass](#orte-felsenpass).\n- **Turm 1 rechts:** Pechtopf an der Treppe (GES 13 oder 3W6 Feuer),\n  der Verwüster steht auf dem Beobachtungsstand (Feuerball, Blitzstrahl,\n  Nebelwolke, Fliegen je 2×/Tag).\n- **Zwischenraum:** die drei Eisenschatten im Hinterhalt, eine Ballista\n  von Turm 2 ist auf den Zwischenraum gedreht.\n- **Turm 2 rechts:** der Oger-Kettenschläger hält die Treppe (3 m\n  Reichweite, Kettenschlag betäubt), der Champion steht oben an der\n  Treppe und flieht nie; fällt er, brechen die Hobgoblins seiner Stellung.\n- Ballisten → [Geschütze](#regeln-geschuetze).\n\n### Szene 4 – Die Drachenjagd\n\n| Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|\n| Junger roter Drache | 3 | 10 | 18 | 178 | MM |\n\n- In dieser Szene haben die Drachen **keine TP**, sondern einen\n  Trefferzähler (zwei Treffer). Regeln, Ballisten und die fünf\n  Veteranen-Gruppen → [Geschütze](#regeln-geschuetze). Die vollen Werte oben\n  gelten nur, falls ein Drache die Szene überlebt (Feueratem 16W6, drei\n  Zerfetzen je 2W6+6 plus 1W6 Feuer).\n- Die Drachen gehören Kazzamir (Kettenhalsbänder), sind eitel: **Spott**\n  (Einschüchtern oder Auftreten DC 15) hält einen Drachen eine Runde\n  länger vor der Ballista.\n\n---\n\n## Kapitel 4 – Die Schlacht auf der Ebene\n\nDie drei großen Ziele, vom Heer aus gesehen. Alle drei müssen fallen.\n\n| Stelle | Gegner | Anzahl | HG | RK | TP | Quelle |\n|---|---|---|---|---|---|---|\n| Links | Fäulnistroll (Bannerträger) | 1 | 9 | 16 | 138 | MotM |\n| Links | Kriegspriester (im Eisenkorb auf dem Troll) | 1 | 9 | 18 (20 im Korb) | 117 | MotM |\n| Mitte | Höllenfeuer-Masch
